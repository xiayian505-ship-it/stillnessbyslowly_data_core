<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>卡牌等級處理｜Demo｜慢慢軍火庫</title>
  <style>
    :root { font-family: system-ui, sans-serif; color-scheme: light; }
    body { max-width: 980px; margin: 24px auto; padding: 0 18px 40px; line-height: 1.65; }
    h1 { line-height: 1.25; }
    nav a { margin-right: 18px; }
    section { margin: 30px 0; }
    code, pre { font-family: ui-monospace, Consolas, monospace; }
    pre { padding: 14px; border: 1px solid #d7d7d7; background: #f7f7f7; white-space: pre; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #c9c9c9; padding: 9px; text-align: left; vertical-align: top; }
    th { background: #f2f2f2; }
    .controls { display: flex; flex-wrap: wrap; gap: 10px; }
    button { padding: 8px 12px; cursor: pointer; }
    .note { border-left: 3px solid #777; padding-left: 14px; }
    .pass { color: #176739; }
    .fail { color: #a61b1b; }
  </style>
</head>
<body>
  <nav><a href="card_level_progression_usage.html">使用說明</a> <a href="card_level_progression_demo.html">Demo 展示</a> <a href="test_card_level_progression.html">功能測試</a></nav>
  <h1>卡牌等級處理｜Demo</h1>
  <p>計算暫時等級增減後的有效等級；依宿主條件及上限升級選定卡牌。</p>

  <section>
    <h2>可操作示範</h2>
    <p>以下資料與操作僅用於展示積木 API；不是《霧林之契》，也不是策略系卡牌完成品。</p>
    <div class="controls">
      <button type="button" data-action="upgrade">升級合資格卡</button>
      <button type="button" data-action="bonus">計算暫時加成</button>
      <button type="button" data-action="reset">重設卡牌</button>
    </div>
    <h3>目前結果</h3>
    <pre id="demoOutput" aria-live="polite"></pre>
  </section>
  
  <script src="./card_level_progression.js"></script>
  <script>
    let ownedCards = [
      { id: "alpha", level: 1, canUpgrade: true },
      { id: "beta", level: 3, canUpgrade: false }
    ];

    function runDemo(actionName) {
      if (actionName === "reset") {
        ownedCards = [
          { id: "alpha", level: 1, canUpgrade: true },
          { id: "beta", level: 3, canUpgrade: false }
        ];
      }

      if (actionName === "upgrade") {
        CardLevelProgression.upgradeEligibleCards(ownedCards, {
          maximumLevel: 5,
          canUpgradeCard: card => card.canUpgrade
        });
      }

      if (actionName === "bonus") {
        return {
          currentCards: ownedCards,
          temporaryLevel: CardLevelProgression.calculateEffectiveLevel(ownedCards[0].level, 2, { maximumLevel: 5 })
        };
      }

      return ownedCards;
    }

    const outputElement = document.getElementById("demoOutput");

    // Demo 的按鈕和狀態顯示都只屬於本頁，不包含在零件本身。
    function showDemoResult(actionName) {
      try {
        const demoResult = runDemo(actionName);
        outputElement.textContent = JSON.stringify(demoResult, null, 2);
      } catch (error) {
        outputElement.textContent = error.name + ": " + error.message;
      }
    }

    document.querySelectorAll("[data-action]").forEach(function (buttonElement) {
      buttonElement.addEventListener("click", function () {
        showDemoResult(buttonElement.dataset.action);
      });
    });

    showDemoResult("upgrade");
  </script>
</body>
</html>
