<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Linked Opacity | 慢慢軍火庫測試</title><style>body{margin:0;color:#243047;font-family:system-ui,"Microsoft JhengHei",sans-serif;line-height:1.7;background:#f0f4f9;} main{max-width:960px;margin:auto;padding:32px 20px;}h1{font-size:clamp(1.5rem,4vw,2.25rem);line-height:1.2}code{font-size:.9em} .intro{min-height:82vh;padding:30px;box-sizing:border-box;background:linear-gradient(150deg,#fff,#dceafe)}.card{width:min(360px,82vw);box-sizing:border-box;padding:24px;border-radius:18px;background:#fff;box-shadow:0 10px 26px #0c345226;font-weight:700;font-size:1.4rem;text-align:center}.spacer{height:95vh}.end{min-height:70vh;background:#dceafe;padding:40px 24px}.tag{background:#e8efff;padding:3px 7px;border-radius:5px}
</style><link rel="stylesheet" href="./opacity.css"><style>.progress-line{height:6px;background:#b5ccf4;position:sticky;top:0;z-index:10}.progress-line b{display:block;height:100%;background:#4164ba;transform-origin:left;transform:scaleX(var(--slowly-scroll-item-progress,0))}</style></head><body><header class="intro"><main><h1>Linked / Opacity</h1><p>往下捲動，元素的效果跟捲動進度連動；往上滑會倒轉。</p><p>單獨載入 <code>./opacity.css</code>，搭配 <code>trigger/element_progress.js</code>。元素外層是進度計算區域，不參與變形。</p></main></header><section id="progress-zone" style="min-height:210vh;position:relative;padding:1px"><div class="progress-line"><b></b></div><div style="position:sticky;top:27vh;display:grid;justify-items:center;gap:18px;padding:40px 10px"><div class="card slowly-scroll-opacity">Opacity</div><div id="progress-label" class="tag">0%</div></div></section><footer class="end">測試：效果應跟著捲動進度前進／退回。</footer><script src="../trigger/element_progress.js"></script><script>SlowlyScrollElementProgress.attach('#progress-zone', { onUpdate(value) { document.querySelector('#progress-label').textContent = Math.round(value*100) + '%'; } });</script></body></html>
