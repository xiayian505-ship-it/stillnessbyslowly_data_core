<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image Resize｜實際操作 Demo</title>
<style>
body { margin: 1rem auto; padding: 0 1rem 3rem; max-width: 920px; font: 16px/1.6 system-ui, sans-serif; }
button, input, select, textarea { font: inherit; }
button, input, select { min-height: 40px; }
button { cursor: pointer; margin: .2rem; }
fieldset { margin: 1rem 0; border: 1px solid #aaa; }
label { display: inline-flex; flex-direction: column; margin: .25rem .65rem .25rem 0; }
pre, output { white-space: pre-wrap; overflow-wrap: anywhere; }
pre { border: 1px solid #bbb; padding: .6rem; }
table { border-collapse: collapse; width: 100%; }
th, td { border: 1px solid #aaa; padding: .3rem .5rem; text-align: left; vertical-align: top; }
.pass { color: #14622c; } .fail { color: #a22222; }
#results > li { margin-bottom: .25rem; }

</style>
</head>
<body>
<main>
<h1>Image Resize｜實際操作 Demo</h1>
<p>使用舊有 ImageResize.resize()，以最大寬高約束尺寸。不是指定檔案大小的壓縮器。</p>

<p><label>選擇本機圖片<input id="image_file" type="file" accept="image/*"></label></p>
<fieldset><legend>尺寸與格式</legend>
<label>最大寬<input id="max_width" type="number" min="1" value="600"></label>
<label>最大高<input id="max_height" type="number" min="1" value="600"></label>
<label>格式<select id="output_type"><option value="image/jpeg">JPEG</option><option value="image/png">PNG</option><option value="image/webp">WebP</option></select></label>
<label>品質（0～1，JPEG/WebP）<input id="quality" type="number" min="0" max="1" step="0.05" value="0.82"></label>
<p><button id="resize_button" type="button">縮圖並預覽</button></p></fieldset>
<pre id="report" aria-live="polite">請選擇圖片。</pre>
<img id="preview" alt="輸出縮圖預覽" hidden style="max-width: 100%; height: auto;">

</main>
<script src="https://lib.stillnessbyslowly.com/Image/image_resize.js"></script>
<script>

const file_input = document.querySelector("#image_file");
const preview = document.querySelector("#preview");
const report = document.querySelector("#report");
let preview_url = null;
function replace_preview(blob) {
  if (preview_url) URL.revokeObjectURL(preview_url);
  preview_url = URL.createObjectURL(blob);
  preview.src = preview_url;
  preview.hidden = false;
}
window.addEventListener("pagehide", () => { if (preview_url) URL.revokeObjectURL(preview_url); });
document.querySelector("#resize_button").addEventListener("click", async function () {
  const image_file = file_input.files?.[0];
  if (!image_file) { report.textContent = "請先選擇一張圖片。"; return; }
  report.textContent = "處理中……";
  try {
    const result = await window.ImageResize.resize(image_file, {
      maxWidth: Number(document.querySelector("#max_width").value),
      maxHeight: Number(document.querySelector("#max_height").value),
      type: document.querySelector("#output_type").value,
      quality: Number(document.querySelector("#quality").value)
    });
    replace_preview(result.blob);
    report.textContent = "來源：" + result.sourceWidth + " × " + result.sourceHeight +
      "、" + result.sourceBytes + " bytes\n輸出：" + result.width + " × " + result.height +
      "、" + result.outputBytes + " bytes\n輸出格式：" + result.type;
  } catch (error) {
    report.textContent = "處理失敗：" + error.message;
  }
});

</script>
</body>
</html>
