<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lineart｜真實 PASS／FAIL 功能測試</title>
<style>
body { margin: 1rem auto; padding: 0 1rem 3rem; max-width: 920px; font: 16px/1.6 system-ui, sans-serif; }
button, input, select, textarea { font: inherit; }
button, input, select { min-height: 40px; }
button { cursor: pointer; margin: .2rem; }
fieldset { margin: 1rem 0; border: 1px solid #aaa; }
label { display: inline-flex; flex-direction: column; margin: .25rem .65rem .25rem 0; }
pre, output { white-space: pre-wrap; overflow-wrap: anywhere; }
pre { border: 1px solid #bbb; padding: .6rem; }
table { border-collapse: collapse; width: 100%; }
th, td { border: 1px solid #aaa; padding: .3rem .5rem; text-align: left; vertical-align: top; }
.pass { color: #14622c; } .fail { color: #a22222; }
#results > li { margin-bottom: .25rem; }

</style>
</head>
<body>
<main>
<h1>Lineart｜真實 PASS／FAIL 功能測試</h1>
<p>用真 Canvas 模擬純色／分界／漸層，檢查原始 Sobel 輸出；已知邊框風險不隱藏。</p>
<p><button id="run_tests" type="button">重新執行測試</button>　<strong id="summary" aria-live="polite">等待測試</strong></p><ol id="results"></ol>
</main>
<script src="https://lib.stillnessbyslowly.com/Image/lineart.js"></script>
<script>

const test_cases = [];
function test(name, action) {
  test_cases.push({ name, action });
}
function assert(condition, message = "斷言失敗") {
  if (!condition) throw new Error(message);
}
function equal(actual, expected, message = "值不相等") {
  assert(Object.is(actual, expected), message + `，取得 ${JSON.stringify(actual)}，預期 ${JSON.stringify(expected)}`);
}
async function rejects(action, message = "應該拒絕無效資料") {
  let rejected = false;
  try { await action(); } catch (error) { rejected = true; }
  assert(rejected, message);
}

const api = window.Lineart;
function make_canvas(width, height, paint) {
  const canvas = document.createElement("canvas");
  canvas.width=width; canvas.height=height;
  const context=canvas.getContext("2d");
  if (paint) paint(context,width,height);
  return canvas;
}
function draw(input,threshold=12) {
  const output=make_canvas(1,1);
  api.draw(input,output,{threshold});
  return output;
}
function count_dark(canvas) {
  const data=canvas.getContext("2d").getImageData(0,0,canvas.width,canvas.height).data;
  let count=0;
  for(let index=0;index<data.length;index+=4) if(data[index+3] && data[index] < 128) count++;
  return count;
}
test("原始 Lineart.draw API 存在", () => assert(typeof api?.draw === "function"));
test("回傳輸出 Canvas 本身", () => {
  const input=make_canvas(6,6); const output=make_canvas(1,1);
  assert(api.draw(input,output,{threshold:12})===output);
});
test("輸出 Canvas 尺寸等於來源", () => {
  const output=draw(make_canvas(28,19));
  equal(output.width,28); equal(output.height,19);
});
test("純色白圖中央輸出白色", () => {
  const output=draw(make_canvas(12,12,context=>{context.fillStyle="white";context.fillRect(0,0,12,12);}));
  const pixel=output.getContext("2d").getImageData(6,6,1,1).data;
  equal(pixel[0],255); equal(pixel[3],255);
});
test("垂直黑白分界產生明顯黑線", () => {
  const input=make_canvas(24,24,(context)=>{
    context.fillStyle="white";context.fillRect(0,0,24,24);
    context.fillStyle="black";context.fillRect(0,0,12,24);
  });
  assert(count_dark(draw(input,12))>0,"應偵測到深色邊線");
});
test("threshold 不同會改變邊線量", () => {
  const input=make_canvas(24,24,context=>{
    const gradient=context.createLinearGradient(0,0,24,0);
    gradient.addColorStop(0,"rgb(20,20,20)");gradient.addColorStop(1,"rgb(200,200,200)");
    context.fillStyle=gradient;context.fillRect(0,0,24,24);
  });
  assert(count_dark(draw(input,1))>count_dark(draw(input,250)),"調整 threshold 預期應改變深色像素數");
});
test("缺少 img 必須拒絕", () => rejects(() => api.draw(null,make_canvas(5,5),{})));
test("缺少 canvas 必須拒絕", () => rejects(() => api.draw(make_canvas(5,5),null,{})));
test("來源尺寸零必須拒絕", () => rejects(() => api.draw(make_canvas(0,5),make_canvas(1,1),{})));
test("無 Canvas 2D context 會拒絕，而非假成功", () => {
  const output=make_canvas(1,1);
  output.getContext=()=>null;
  return rejects(() => api.draw(make_canvas(6,6),output,{}));
});
test("被瀏覽器阻止讀取像素時應拋出安全錯誤", () => {
  const output=make_canvas(1,1);
  const fake_context={drawImage(){},getImageData(){throw new DOMException("tainted","SecurityError");}};
  output.getContext=()=>fake_context;
  return rejects(() => api.draw(make_canvas(6,6),output,{}));
});
test("重複呼叫可重繪不同 threshold", () => {
  const source=make_canvas(20,20,context=>{
    context.fillStyle="white"; context.fillRect(0,0,20,20);
    context.fillStyle="black"; context.fillRect(0,0,8,20);
  });
  const output=make_canvas(1,1);
  api.draw(source,output,{threshold:5});
  api.draw(source,output,{threshold:200});
  equal(output.width,20);equal(output.height,20);
});
test("來源 Canvas 的像素不被改寫", () => {
  const source=make_canvas(10,10,context=>{
    context.fillStyle="rgb(100, 50, 25)"; context.fillRect(0,0,10,10);
  });
  const before=Array.from(source.getContext("2d").getImageData(4,4,1,1).data);
  draw(source);
  const after=Array.from(source.getContext("2d").getImageData(4,4,1,1).data);
  equal(JSON.stringify(before),JSON.stringify(after));
});
test("輸出四周邊界應不透明（舊核心風險）", () => {
  const source=make_canvas(10,10,context=>{
    context.fillStyle="white";context.fillRect(0,0,10,10);
  });
  const output=draw(source);
  const pixel=output.getContext("2d").getImageData(0,0,1,1).data;
  equal(pixel[3],255,"應有非透明背景；舊核心可能保留透明邊框");
});

async function run_tests() {
  const results = document.querySelector("#results");
  results.replaceChildren();
  let passed = 0;
  let failed = 0;
  for (const item of test_cases) {
    const entry = document.createElement("li");
    try {
      await item.action();
      passed += 1;
      entry.className = "pass";
      entry.textContent = "PASS｜" + item.name;
    } catch (error) {
      failed += 1;
      entry.className = "fail";
      entry.textContent = "FAIL｜" + item.name + "：" + (error?.message || String(error));
      console.error("測試失敗：" + item.name, error);
    }
    results.appendChild(entry);
  }
  document.querySelector("#summary").textContent = `${passed} PASS／${failed} FAIL／${test_cases.length} TOTAL`;
  document.body.dataset.passed = String(passed);
  document.body.dataset.failed = String(failed);
}
document.querySelector("#run_tests").addEventListener("click", run_tests);
run_tests();

</script>
</body>
</html>
