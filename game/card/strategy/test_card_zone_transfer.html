  <h1>卡牌區域移轉｜功能測試</h1>
  <p>借用既有 Deck 的快照與還原介面，在牌庫／手牌／棄牌區之間移動或交換卡牌。</p>

  <section>
    <h2>獨立測試結果</h2>
    <p>下列斷言使用目前頁面引入的實際零件執行，而不是預先寫好的 PASS 字樣。</p>
    <pre id="testResults" aria-live="polite"></pre>
  </section>
  <script src="../deck.js"></script>
  <script src="./card_zone_transfer.js"></script>
  <script>
    const testLines = [];
    let failureCount = 0;

    function verify(description, condition) {
      const passed = Boolean(condition);
      if (!passed) {
        failureCount += 1;
      }
      testLines.push((passed ? "PASS  " : "FAIL  ") + description);
    }

    function throwsError(callback) {
      try {
        callback();
        return false;
      } catch (error) {
        return true;
      }
    }

    try {
      const firstDeck = Deck.create({ items: [], shuffleOnReset: false });
      const secondDeck = Deck.create({ items: [], shuffleOnReset: false });
      firstDeck.restore({ ...firstDeck.snapshot(), hand: ["A", "B"] });
      secondDeck.restore({ ...secondDeck.snapshot(), hand: ["C"] });
      const movement = CardZoneTransfer.moveCard({ sourceDeck: firstDeck, sourceZone: "hand", destinationDeck: secondDeck, destinationZone: "discardPile", cardSelection: 0 });
      verify("跨牌庫移動成功", movement.ok && secondDeck.snapshot().discardPile[0] === "A");
      verify("來源手牌數正確", firstDeck.snapshot().hand.length === 1);
      const beforeFailedMove = JSON.stringify(firstDeck.snapshot());
      const missingCard = CardZoneTransfer.moveCard({ sourceDeck: firstDeck, sourceZone: "hand", destinationDeck: secondDeck, destinationZone: "hand", cardSelection: 99 });
      verify("選不到卡不會改來源", !missingCard.ok && JSON.stringify(firstDeck.snapshot()) === beforeFailedMove);
      CardZoneTransfer.swapCards({ firstDeck, secondDeck, firstSelection: 0, secondSelection: 0 });
      verify("交換後雙方手牌正確", firstDeck.snapshot().hand[0] === "C" && secondDeck.snapshot().hand[0] === "B");
    } catch (error) {
      failureCount += 1;
      testLines.push("FAIL  測試執行錯誤：" + error.message);
    }

    testLines.push("");
    testLines.push(failureCount === 0 ? "ALL PASS" : failureCount + " FAILED");
    const resultElement = document.getElementById("testResults");
    resultElement.textContent = testLines.join("\n");
    resultElement.className = failureCount === 0 ? "pass" : "fail";
  </script>
