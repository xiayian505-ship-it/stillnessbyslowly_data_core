<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Linked Blur | 慢慢軍火庫測試</title><style>body{margin:0}main{padding:16px}.intro{min-height:82vh;padding:16px;box-sizing:border-box}.card{display:inline-block;box-sizing:border-box;min-width:120px;padding:16px;border:1px solid currentColor;background:Canvas}.spacer{height:95vh}.end{min-height:65vh;padding:16px}
</style><link rel="stylesheet" href="./blur.css"></head><body><header class="intro"><main><h1>Linked / Blur</h1><p>往下捲動，元素的效果跟捲動進度連動；往上滑會倒轉。</p><p>單獨載入 <code>./blur.css</code>，搭配 <code>trigger/element_progress.js</code>。元素外層是進度計算區域，不參與變形。</p></main></header><section id="progress-zone" style="min-height:210vh;position:relative;padding:1px"><div style="position:sticky;top:27vh;display:grid;justify-items:center;gap:18px;padding:40px 10px"><div class="card slowly-scroll-blur">Blur</div><div id="progress-label" class="tag">0%</div></div></section><footer class="end">測試：效果應跟著捲動進度前進／退回。</footer><script src="../trigger/element_progress.js"></script><script>SlowlyScrollElementProgress.attach('#progress-zone', { onUpdate(value) { document.querySelector('#progress-label').textContent = Math.round(value*100) + '%'; } });</script></body></html>
