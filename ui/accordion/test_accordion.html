<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accordion 真實功能測試</title>

<style>
body { font-family: system-ui, sans-serif; max-width: 900px; margin: 1.5rem auto; padding: 0 1rem; line-height: 1.65; }
button,input,select { font: inherit; padding: .35rem .6rem; margin: .15rem; min-height: 42px; }
pre,code { overflow-wrap: anywhere; white-space: pre-wrap; }
pre,fieldset { border: 1px solid #aaa; padding: .7rem; }
.row { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; }
#results > li { margin: .15rem 0; }
.ok { color: #17622f; } .fail { color: #a01418; }
</style>
</head><body>
<h1>Accordion 真實功能測試</h1>
<p>以下項目皆實際呼叫零件／操作 DOM 後驗證結果，不預填 PASS。測試失敗會以紅字列出。</p><strong id="summary">測試執行中…</strong><ol id="results"></ol><div id="fixture"><div data-slowly-accordion id="subject"><details data-accordion-id="one"><summary>一</summary>內容一</details><details data-accordion-id="two"><summary>二</summary>內容二</details></div><div data-slowly-accordion id="independent"><details data-accordion-id="a"><summary>A</summary>內容</details><details data-accordion-id="b"><summary>B</summary>內容</details></div></div>
<script src="https://lib.stillnessbyslowly.com/ui/accordion/accordion.js"></script>
<script>
const results=document.querySelector('#results');
const summary=document.querySelector('#summary');
let passes=0,failures=0;
function assert(condition, message='assertion failed'){if(!condition)throw new Error(message);}
function expect_error(callback){let threw=false;try{callback();}catch(error){threw=true;}assert(threw,'expected an error');}
function sleep(milliseconds){return new Promise(resolve=>setTimeout(resolve,milliseconds));}
async function test(name, callback){
  const line=document.createElement('li');
  try{await callback();passes++;line.className='ok';line.textContent='PASS — '+name;}
  catch(error){failures++;line.className='fail';line.textContent='FAIL — '+name+': '+error.message;console.error('FAIL',name,error);}
  results.appendChild(line);
  summary.textContent=passes+' PASS / '+failures+' FAIL';
}
window.addEventListener('error', event=>{failures++; const line=document.createElement('li');line.className='fail';line.textContent='FAIL — 瀏覽器執行錯誤: '+event.message;results.appendChild(line);summary.textContent=passes+' PASS / '+failures+' FAIL';});
window.addEventListener('unhandledrejection',event=>{failures++;const line=document.createElement('li');line.className='fail';line.textContent='FAIL — Promise rejected: '+String(event.reason);results.appendChild(line);summary.textContent=passes+' PASS / '+failures+' FAIL';});
(async()=>{

const root=document.querySelector('#subject');
const instance=SlowlyAccordion.create(root);
await test('API 存在且單開預設',()=>assert(typeof instance.open==='function' && instance.snapshot().length===2));
await test('打開指定項',()=>{instance.open('one');assert(root.querySelector('[data-accordion-id="one"]').open);});
await test('互斥關閉其他項',()=>{instance.open('two');assert(!root.querySelector('[data-accordion-id="one"]').open);});
await test('toggle 會收合',()=>{instance.toggle('two');assert(!root.querySelector('[data-accordion-id="two"]').open);});
await test('未知 ID 報錯',()=>expect_error(()=>instance.open('not_found')));
await test('單開不能 open_all',()=>expect_error(()=>instance.open_all()));
await test('多開可同時打開',()=>{const other=SlowlyAccordion.create('#independent',{multiple:true});other.open_all();assert(other.snapshot().every(x=>x.open));});
await test('多實例互不干擾',()=>{assert(instance.snapshot().every(x=>!x.open));});
await test('重複初始化回傳同實例',()=>assert(SlowlyAccordion.create(root)===instance));
await test('原生 toggle 維持單開',async()=>{let nodes=root.querySelectorAll('details');nodes[0].open=true;nodes[1].open=true;await sleep(60);assert(nodes[0].open!==nodes[1].open);});
await test('destroy 允許再次建立',()=>{instance.destroy();const next=SlowlyAccordion.create(root);assert(next!==instance);next.destroy();});

  summary.dataset.done='true';
})().catch(error=>{failures++;summary.textContent=passes+' PASS / '+failures+' FAIL';summary.dataset.done='true';console.error(error);});
</script>
</body></html>
