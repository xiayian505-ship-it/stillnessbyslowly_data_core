<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DateTime 功能測試</title>
<style>
body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:#f5f3ed;color:#37362f}
.wrap{max-width:760px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:24px;margin:0 0 8px}
.intro{color:#777366;margin-bottom:20px}
.test{background:#fffdf8;border:1px solid #ded9cc;padding:14px;margin-bottom:10px}
.name{font-weight:700;margin-bottom:6px}
.result{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;word-break:break-word}
.pass{border-left:4px solid #5f695d}
.fail{border-left:4px solid #8a4b46}
.summary{margin-top:18px;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <h1>DateTime 功能測試</h1>
  <div class="intro">測試本地日期 key、日期解析、日期加減、日期差與常用格式化。</div>
  <div id="results"></div>
  <div id="summary" class="summary"></div>
</div>

<script src="./datetime.js"></script>
<script>
const results = document.getElementById("results");
const summary = document.getElementById("summary");

let passCount = 0;
let failCount = 0;

function showValue(value){
  if(value instanceof Date){
    return Number.isNaN(value.getTime()) ? "Invalid Date" : value.toString();
  }
  if(typeof value === "object") return JSON.stringify(value);
  return String(value);
}

function test(name, actual, expected){
  const pass = actual === expected;
  if(pass) passCount++;
  else failCount++;

  const item = document.createElement("div");
  item.className = `test ${pass ? "pass" : "fail"}`;
  item.innerHTML = `
    <div class="name">${pass ? "PASS" : "FAIL"}｜${name}</div>
    <div class="result">actual:   ${showValue(actual)}
expected: ${showValue(expected)}</div>
  `;
  results.appendChild(item);
}

function testJSON(name, actual, expected){
  test(name, JSON.stringify(actual), JSON.stringify(expected));
}

const localSample = new Date(2026, 8, 8, 14, 35);

test("dateKey：本地 Date → YYYY-MM-DD", DateTime.dateKey(localSample), "2026-09-08");

const parsed = DateTime.parseDateKey("2026-09-08");
test("parseDateKey：年份", parsed?.getFullYear(), 2026);
test("parseDateKey：月份", parsed?.getMonth(), 8);
test("parseDateKey：日期", parsed?.getDate(), 8);
test("parseDateKey：無效日期", DateTime.parseDateKey("2026-02-30"), null);

test("addDays：跨月底", DateTime.addDays("2026-09-30", 1), "2026-10-01");
test("addDays：跨年底", DateTime.addDays("2026-12-31", 1), "2027-01-01");
test("addDays：閏年", DateTime.addDays("2028-02-28", 1), "2028-02-29");
test("addDays：負數", DateTime.addDays("2026-09-08", -8), "2026-08-31");

test("diffDays：正向日期差", DateTime.diffDays("2026-09-01", "2026-09-08"), 7);
test("diffDays：反向日期差", DateTime.diffDays("2026-09-08", "2026-09-01"), -7);

test("formatDate：YYYY/MM/DD", DateTime.formatDate("2026-09-08"), "2026/09/08");
test("formatMMDD：MM/DD", DateTime.formatMMDD("2026-09-08"), "09/08");
test("formatDateTime：YYYY-MM-DD HH:mm", DateTime.formatDateTime(localSample), "2026-09-08 14:35");

const parts = DateTime.diffParts(
  new Date(2026, 8, 7, 10, 0),
  new Date(2026, 8, 8, 12, 30)
);

testJSON(
  "diffParts：天／小時／分鐘",
  {
    sign: parts?.sign,
    days: parts?.days,
    hours: parts?.hours,
    minutes: parts?.minutes
  },
  {
    sign: 1,
    days: 1,
    hours: 2,
    minutes: 30
  }
);

summary.textContent = `完成：${passCount} 通過 / ${failCount} 失敗`;
</script>
</body>
</html>
