<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>自由配置舞台｜功能測試</title>
  <link rel="stylesheet" href="./slot_stage_layout.css">
  <style>
    body { margin: 24px; font-family: system-ui, sans-serif; line-height: 1.6; }
    main { max-width: 850px; }
    .sample-stage { width: 700px; }
    .sample-stage > section { min-height: 70px; padding: 12px; background: #ddd; }
    pre { padding: 16px; background: #f5f5f5; white-space: pre-wrap; }
  </style>
</head>
<body>
<main id="testPage">
  <h1>自由配置舞台｜功能測試</h1>
  <p>檢查插槽矩陣、容器寬度、變更布局和錯誤驗證。</p>

  <div id="sampleStage" class="sample-stage">
    <section data-stage-slot="personOne">甲</section>
    <section data-stage-slot="personTwo">乙</section>
    <section data-stage-slot="centerArea">中央</section>
  </div>
  <pre id="result" aria-live="polite">正在測試……</pre>
</main>
<script src="./slot_stage_layout.js"></script>
<script>
(() => {
  const results = [];
  let passed = 0;
  let failed = 0;

  function check(name, condition) {
    results.push(`${condition ? "PASS" : "FAIL"}｜${name}`);
    if (condition) {
      passed += 1;
    } else {
      failed += 1;
    }
  }

  function throwsError(action) {
    try {
      action();
      return false;
    } catch (error) {
      return error instanceof Error;
    }
  }

  const narrow = {
    name: "narrow",
    minWidth: 0,
    areas: [["personOne"], ["centerArea"], ["personTwo"]]
  };
  const wide = {
    name: "wide",
    minWidth: 460,
    areas: [["personOne", "centerArea", "personTwo"]],
    columns: ["1fr", "2fr", "1fr"]
  };
  const root = document.getElementById("sampleStage");

  try {
    const layout = SlowlySlotStageLayout.create(root, { layouts: [narrow, wide] });
    check("寬容器使用 wide 布局", layout.activeLayout === "wide");
    check("同根元素重複 create 不會重複初始化", SlowlySlotStageLayout.create(root) === layout);
    check("可由名稱取得原生插槽", layout.getSlot("personOne") === root.children[0]);
    check("未知插槽回傳 null", layout.getSlot("missing") === null);
    check("插槽有對應 grid-area", getComputedStyle(root.children[1]).gridArea === "personTwo");
    check("寬布局有三欄", getComputedStyle(root).gridTemplateAreas.includes('"personOne centerArea personTwo"'));

    root.style.width = "320px";
    layout.refresh();
    check("依自己的容器寬度選窄版", layout.activeLayout === "narrow");
    check("窄版是三列而非三欄", getComputedStyle(root).gridTemplateAreas.includes('"personOne" "centerArea" "personTwo"'));

    layout.setLayouts([
      narrow,
      {
        name: "upperLower",
        minWidth: 300,
        areas: [["personOne", "personTwo"], ["centerArea", "centerArea"]]
      }
    ]);
    check("setLayouts 可換成新的區域排列", layout.activeLayout === "upperLower");
    check("跨兩欄矩形區域被接受", getComputedStyle(root).gridTemplateAreas.includes('"centerArea centerArea"'));

    check("沒有 minWidth 0 的布局不合法", throwsError(() => layout.setLayouts([wide])));
    check("布局名稱重複不合法", throwsError(() => layout.setLayouts([narrow, narrow])));
    check("引用不存在的插槽不合法", throwsError(() => layout.setLayouts([
      { name: "broken", minWidth: 0, areas: [["personOne", "unknown"], ["centerArea", "personTwo"]] }
    ])));
    check("同名區域不為矩形不合法", throwsError(() => layout.setLayouts([
      { name: "broken", minWidth: 0, areas: [["personOne", "centerArea"], ["personTwo", "personOne"]] }
    ])));
    check("錯誤設定不會蓋掉目前有效布局", layout.activeLayout === "upperLower");

    layout.destroy();
    check("destroy 清理原本沒有的 grid-area", root.children[0].style.getPropertyValue("grid-area") === "");
    check("destroy 清理原本沒有的 grid-template-areas", root.style.getPropertyValue("grid-template-areas") === "");
    check("destroy 後 refresh 會拋錯", throwsError(() => layout.refresh()));
    const recreated = SlowlySlotStageLayout.create(root, { layouts: [narrow] });
    check("destroy 後可重新初始化", recreated !== layout);
    recreated.destroy();
  } catch (error) {
    check(`未預期例外：${error.stack || error.message}`, false);
  }

  document.getElementById("result").textContent = `${passed} PASS／${failed} FAIL\n\n${results.join("\n")}`;
  document.getElementById("testPage").dataset.testComplete = "true";
  document.getElementById("testPage").dataset.failedCount = String(failed);
})();
</script>
</body>
</html>
