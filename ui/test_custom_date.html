<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Slowly Custom Date Test</title>
  <link rel="stylesheet" href="./custom_date.css">
</head>
<body>
  <h1>Slowly Custom Date Test</h1>

  <p>
    <label>
      一般日期
      <input type="date" id="dateA" data-slowly-date>
    </label>
  </p>

  <p>
    <label>
      有預設值
      <input type="date" id="dateB" value="2026-09-13" data-slowly-date>
    </label>
  </p>

  <p>
    <label>
      min / max
      <input
        type="date"
        id="dateC"
        min="2026-09-01"
        max="2026-09-30"
        data-slowly-date
      >
    </label>
  </p>

  <p>
    <label>
      disabled
      <input type="date" id="dateD" disabled data-slowly-date>
    </label>
  </p>

  <pre id="output"></pre>

  <script src="./custom_date.js"></script>
  <script>
    const output = document.querySelector("#output");
    const inputs = Array.from(
      document.querySelectorAll('input[type="date"][data-slowly-date]')
    );

    SlowlyDate.createAll();

    function show(){
      output.textContent = inputs
        .map(input => `${input.id}: ${input.value || "(空)"}`)
        .join("\n");
    }

    inputs.forEach(input=>{
      input.addEventListener("input", show);
      input.addEventListener("change", show);
    });

    show();
  </script>
</body>
</html>
