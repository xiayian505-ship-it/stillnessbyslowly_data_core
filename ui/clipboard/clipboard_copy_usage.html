<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>Clipboard Copy 使用說明</title><body><h1>Clipboard Copy</h1><p>只負責把文字寫入剪貼簿。優先使用 Clipboard API，失敗或不可用時使用 textarea fallback。</p><h2>載入</h2><pre>&lt;script src="https://lib.stillnessbyslowly.com/ui/clipboard/clipboard_copy.js"&gt;&lt;/script&gt;</pre><h2>API</h2><pre>await SlowlyClipboardCopy.copy("要複製的文字");</pre><p>回傳 Promise；成功為 true。模組不顯示 Toast、不建立按鈕。</p></body></html>
