<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timestamp 功能測試</title>

  <style>
    body{
      margin:0;
      padding:24px;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;
      color:#222;
      background:#fff;
      line-height:1.6;
    }

    main{
      width:min(900px,100%);
      margin:0 auto;
    }

    h1{
      margin:0 0 8px;
      font-size:1.7rem;
    }

    .intro{
      margin:0 0 24px;
      color:#666;
    }

    .test{
      padding:16px 0;
      border-top:1px solid #ddd;
    }

    .test:last-child{
      border-bottom:1px solid #ddd;
    }

    .test-title{
      margin-bottom:8px;
      font-weight:700;
    }

    code{
      display:block;
      padding:10px 12px;
      background:#f6f6f6;
      border-radius:8px;
      overflow-wrap:anywhere;
    }

    .pass{
      color:#2f6b45;
    }

    .fail{
      color:#9a3f3f;
    }
  </style>
</head>

<body>
  <main>
    <h1>Timestamp 功能測試</h1>
    <p class="intro">
      測試 Timestamp.create() 產生 YYYYMMDDHHmmssSSS 格式的本地時間戳。
    </p>

    <div id="tests"></div>
  </main>

  <script src="./timestamp.js"></script>

  <script>
    const tests = document.querySelector("#tests");

    function addTest(title, value, pass){
      const item = document.createElement("section");
      item.className = "test";

      const heading = document.createElement("div");
      heading.className = "test-title";
      heading.textContent = title;

      const result = document.createElement("code");
      result.textContent = String(value);

      const status = document.createElement("div");
      status.className = pass ? "pass" : "fail";
      status.textContent = pass ? "PASS" : "FAIL";

      item.append(heading, result, status);
      tests.append(item);
    }

    const current = Timestamp.create();
    addTest(
      "目前時間：應產生 17 位數時間戳",
      current,
      /^\d{17}$/.test(current)
    );

    const fixedDate = new Date(2026, 8, 8, 18, 56, 32, 147);
    const fixed = Timestamp.create(fixedDate);
    addTest(
      "指定 Date：2026-09-08 18:56:32.147",
      fixed,
      fixed === "20260908185632147"
    );

    const fromNumber = Timestamp.create(fixedDate.getTime());
    addTest(
      "指定毫秒數：應與 Date 結果相同",
      fromNumber,
      fromNumber === "20260908185632147"
    );

    const invalid = Timestamp.create(new Date("invalid"));
    addTest(
      "無效 Date：應回傳空字串",
      JSON.stringify(invalid),
      invalid === ""
    );

    addTest(
      "API：Timestamp.create 應存在",
      typeof Timestamp.create,
      typeof Timestamp.create === "function"
    );
  </script>
</body>
</html>
