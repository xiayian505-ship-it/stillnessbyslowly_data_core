<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curtain Transition Test</title>
<link rel="stylesheet" href="./curtain_transition.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; font-family: sans-serif; background: #eee3cf; color: #2d241c; }
  .test-stage { width: min(820px, 100%); margin: 0 auto; border-radius: 20px; box-shadow: 0 18px 50px rgba(60,35,18,.18); }
  .surface { position: relative; min-height: 420px; overflow: hidden; border-radius: inherit; background: #f6eddb; }
  .page { position: absolute; inset: 0; display: none; place-items: center; padding: 32px; text-align: center; background: linear-gradient(145deg, #fff9e9, #ead7b6); }
  .page:nth-child(2) { background: linear-gradient(145deg, #dcecf2, #ead7b6); }
  .page.is-active,
  .page.sbs-curtain-transition-incoming,
  .page.sbs-curtain-transition-outgoing { display: grid; }
  .page strong { display: block; font-size: clamp(2rem, 8vw, 4rem); }
  .controls { width: min(820px, 100%); margin: 14px auto 0; display: flex; gap: 8px; flex-wrap: wrap; }
  .test-stage.is-blue-curtain {
    --sbs-curtain-color-top: #244f7a;
    --sbs-curtain-color-mid: #173653;
    --sbs-curtain-color-bottom: #0b2238;
    --sbs-curtain-trim: rgba(170,220,255,.48);
    --sbs-curtain-spotlight-core: rgba(226,246,255,.98);
    --sbs-curtain-spotlight-mid: rgba(154,218,255,.56);
    --sbs-curtain-spotlight-soft: rgba(93,181,255,.18);
    --sbs-curtain-spotlight-wash-top: rgba(215,241,255,.42);
    --sbs-curtain-spotlight-wash-mid: rgba(114,196,255,.10);
    --sbs-curtain-vignette-edge: rgba(4,15,28,.62);
  }
</style>
</head>
<body>
<div id="host" class="test-stage">
  <div id="surface" class="surface">
    <section class="page is-active"><div><strong>♠</strong><p>第一幕</p></div></section>
    <section class="page"><div><strong>♣</strong><p>第二幕</p></div></section>
  </div>
</div>
<div class="controls">
  <button id="play" type="button">播放切換</button>
  <button id="clear" type="button">清除狀態</button>
  <button id="skin" type="button">切換藍幕</button>
</div>
<script src="./curtain_transition.js"></script>
<script>
const host = document.querySelector('#host');
const surface = document.querySelector('#surface');
const pages = [...document.querySelectorAll('.page')];
const curtain = SlowlyCurtainTransition.create(host, { surface });
let active = 0;
let running = false;

document.querySelector('#play').addEventListener('click', async () => {
  if (running) return;
  running = true;
  const next = (active + 1) % pages.length;
  const from = pages[active];
  const to = pages[next];
  const result = await curtain.play({ outgoing: from, incoming: to });
  if (!result.interrupted) {
    from.classList.remove('is-active');
    to.classList.add('is-active');
    active = next;
  }
  running = false;
});

document.querySelector('#clear').addEventListener('click', () => {
  curtain.clear();
  running = false;
});

document.querySelector('#skin').addEventListener('click', () => {
  host.classList.toggle('is-blue-curtain');
});
</script>
</body>
</html>
