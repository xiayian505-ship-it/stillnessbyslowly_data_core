<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Media Recorder Test</title></head>
<body>
<h1>Media Recorder — 功能測試</h1>
<p>純測試頁，沒有自訂 CSS。單獨載入本零件；測試用的 DOM 操作不是積木的一部分。</p>
<p>本測試使用測試頁自行繪製的 Canvas 串流，不需要上傳影片。</p>
<p><canvas id="canvas" width="280" height="100"></canvas></p>
<p><button id="start">開始錄製</button> <button id="stop" disabled>結束錄製</button></p>
<pre id="out" aria-live="polite"></pre>
<script src="./media_recorder.js"></script>
<script>
"use strict";
const out = document.getElementById("out");
let recorder,stream,frames=[],tick;
const canvas=document.querySelector("#canvas"),ctx=canvas.getContext("2d");let count=0;
function draw(){ctx.fillStyle=count++%2?"#ddd":"#333";ctx.fillRect(0,0,280,100);ctx.fillStyle="#f66";ctx.fillRect(count%240,25,40,40);}
draw();
document.getElementById("start").onclick=()=>{try{if(!canvas.captureStream)throw Error("無 Canvas captureStream");stream=canvas.captureStream(10);recorder=SlowlyVideoMediaRecorder.create(stream);frames=[];recorder.addEventListener("dataavailable",e=>{if(e.data.size)frames.push(e.data);});SlowlyVideoMediaRecorder.start(recorder,250);tick=setInterval(draw,80);document.getElementById("start").disabled=true;document.getElementById("stop").disabled=false;out.textContent="錄製中";}catch(e){out.textContent=e.message;if(stream)stream.getTracks().forEach(t=>t.stop());}};
document.getElementById("stop").onclick=async()=>{try{await SlowlyVideoMediaRecorder.stop(recorder);out.textContent="已停止，錄得片段="+frames.length+"；位元組="+frames.reduce((n,b)=>n+b.size,0);}catch(e){out.textContent=e.message;}finally{clearInterval(tick);if(stream)stream.getTracks().forEach(t=>t.stop());document.getElementById("start").disabled=false;document.getElementById("stop").disabled=true;}};
</script>
</body></html>
