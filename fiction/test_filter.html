<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fiction Filter 功能測試</title>
  <style>
    :root {
      --bg: #f4f5f5;
      --surface: #ffffff;
      --text: #202426;
      --muted: #687176;
      --line: #d9dddf;
      --accent: #536d78;
      --content: 860px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, "Microsoft JhengHei", sans-serif;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    main {
      width: min(calc(100% - 32px), var(--content));
      margin: 0 auto;
      padding: 64px 0;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 2rem;
    }

    .intro {
      margin: 0 0 32px;
      color: var(--muted);
      line-height: 1.8;
    }

    .status {
      margin-bottom: 20px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      background: var(--surface);
      line-height: 1.7;
    }

    .grid {
      display: grid;
      gap: 14px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .card {
      padding: 18px;
      border: 1px solid var(--line);
      background: var(--surface);
    }

    .card h2 {
      margin: 0 0 12px;
      font-size: 1.05rem;
    }

    .desc {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.6;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button {
      padding: 8px 12px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
    }

    button:hover { border-color: var(--accent); }

    pre {
      margin: 20px 0 0;
      padding: 18px;
      min-height: 220px;
      overflow: auto;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .back {
      display: inline-block;
      margin-top: 18px;
      color: var(--accent);
      text-decoration: none;
    }

    .back:hover { text-decoration: underline; }

    @media (max-width: 680px) {
      main {
        width: min(calc(100% - 24px), var(--content));
        padding: 40px 0;
      }

      h1 { font-size: 1.7rem; }

      .grid { grid-template-columns: 1fr; }

      .card { padding: 16px; }

      pre {
        min-height: 180px;
        padding: 14px;
      }
    }
</style>
</head>
<body>
  <main>
    <h1>Fiction Filter 功能測試</h1>
    <p class="intro">測試 Fiction_filter.js 的 equals、boolean、containsAll、containsAny 與 predicate。</p>
    <div class="status" id="status">模組檢查中...</div>
    <div class="grid">
      <section class="card">
        <h2>Filter</h2>
        <p class="desc">使用固定測試資料執行不同篩選規則。</p>
        <div class="actions">
          <button id="equals">category = 奇幻</button>
          <button id="boolean">finished = true</button>
          <button id="all">同時含奇幻、冒險</button>
          <button id="any">含懸疑或日常</button>
          <button id="predicate">score ≥ 30</button>
        </div>
      </section>
    </div>
    <pre id="output">等待操作...</pre>
    <a class="back" href="../">返回慢慢的倉庫</a>
  </main>
  <script src="./Fiction_filter.js"></script>
  <script>
    const statusEl = document.getElementById("status");
    const output = document.getElementById("output");
    const items = [
      { title: "月下旅人", category: "奇幻", finished: true, categories: ["奇幻", "冒險"], score: 30 },
      { title: "白塔", category: "懸疑", finished: false, categories: ["懸疑"], score: 10 },
      { title: "海邊書店", category: "日常", finished: true, categories: ["日常"], score: 40 }
    ];

    function show(title, data) {
      output.textContent = title + "\n\n" + JSON.stringify(data, null, 2);
    }

    if (typeof FictionFilter === "undefined") {
      statusEl.textContent = "載入失敗：找不到 FictionFilter";
      throw new Error("FictionFilter 未載入");
    }

    statusEl.textContent = "載入成功：FictionFilter v" + FictionFilter.version;

    document.getElementById("equals").onclick = () =>
      show("category = 奇幻", FictionFilter.filter(items, { equals: { category: "奇幻" } }));

    document.getElementById("boolean").onclick = () =>
      show("finished = true", FictionFilter.filter(items, { boolean: { finished: true } }));

    document.getElementById("all").onclick = () =>
      show("同時含奇幻、冒險", FictionFilter.filter(items, { containsAll: { categories: ["奇幻", "冒險"] } }));

    document.getElementById("any").onclick = () =>
      show("含懸疑或日常", FictionFilter.filter(items, { containsAny: { categories: ["懸疑", "日常"] } }));

    document.getElementById("predicate").onclick = () =>
      show("score ≥ 30", FictionFilter.filter(items, { predicate: item => item.score >= 30 }));
  </script>
</body>
</html>
