  <style>

    body { max-width: 980px; margin: 24px auto; padding: 0 18px 40px; line-height: 1.65; }

<body>
  <nav><a href="card_target_selection_usage.html">使用說明</a> <a href="card_target_selection_demo.html">Demo 展示</a> <a href="test_card_target_selection.html">功能測試</a></nav>
  <h1>候選目標選擇｜Demo</h1>
  <p>從宿主提供的卡牌區域收集候選目標，依自訂條件篩選、查找或選取。</p>

  <section>
    <h2>可操作示範</h2>
    <p>以下資料與操作僅用於展示積木 API；不是《霧林之契》，也不是策略系卡牌完成品。</p>
    <div class="controls">
      <button type="button" data-action="all">顯示全部候選</button>
      <button type="button" data-action="filtered">只顯示第二方</button>
      <button type="button" data-action="random">隨機選一張</button>
    </div>
    <h3>目前結果</h3>
    <pre id="demoOutput" aria-live="polite"></pre>
  </section>
  
  <script src="./card_target_selection.js"></script>
  <script>
    const cardZones = [
      { owner: "north", zone: "hand", cards: [{ id: "A" }, { id: "B" }] },
      { owner: "south", zone: "hand", cards: [{ id: "C" }, { id: "D" }] }
    ];

    function runDemo(actionName) {
      const eligibleCandidates = CardTargetSelection.collectCandidates(
        cardZones,
        candidate => actionName === "all" || candidate.owner === "south"
      );

      if (actionName === "random") {
        return CardTargetSelection.pickRandomCandidate(eligibleCandidates);
      }

      return eligibleCandidates;
    }

    const outputElement = document.getElementById("demoOutput");

    // Demo 的按鈕和狀態顯示都只屬於本頁，不包含在零件本身。
    function showDemoResult(actionName) {
      try {
        const demoResult = runDemo(actionName);
        outputElement.textContent = JSON.stringify(demoResult, null, 2);
      } catch (error) {
        outputElement.textContent = error.name + ": " + error.message;
      }
    }

    document.querySelectorAll("[data-action]").forEach(function (buttonElement) {
      buttonElement.addEventListener("click", function () {
        showDemoResult(buttonElement.dataset.action);
      });
    });

    showDemoResult("all");
  </script>
</body>
</html>
