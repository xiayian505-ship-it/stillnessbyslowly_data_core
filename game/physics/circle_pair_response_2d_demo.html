<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Circle Pair Response 2D｜雙圓反作用｜Demo</title>
<style>
  .grid { display: grid; grid-template-columns: repeat(var(--columns, 5), minmax(32px, 42px)); gap: 3px; margin: 12px 0; }
  .cell { min-height: 37px; touch-action: manipulation; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 10px 0; }
  canvas { border: 1px solid; max-width: 100%; }
  output, pre { display: block; white-space: pre-wrap; margin: 10px 0; }
  button { padding: 5px; }
</style>
</head>
<body>
<h1>Circle Pair Response 2D｜雙圓反作用</h1>
<p>本頁直接呼叫軍火庫零件；只提供辨識與操作必要的尺寸／排列。</p>

<div class="row"><label>第一球質量 <input id="mass_a" type="number" min="0.1" value="1" step="0.5"></label><label>第二球質量 <input id="mass_b" type="number" min="0.1" value="2" step="0.5"></label><label>反彈係數 <input id="restitution" type="number" min="0" max="1" step="0.1" value="0.7"></label></div>
<div class="row"><label>第一球水平速度 <input id="speed_a" type="number" value="30"></label><label>第二球水平速度 <input id="speed_b" type="number" value="-20"></label><button id="solve">計算碰撞</button></div>
<canvas id="canvas" width="310" height="90"></canvas>

<output id="result" aria-live="polite"></output>
<script src="https://lib.stillnessbyslowly.com/game/collision/circle_collision.js"></script>
<script src="https://lib.stillnessbyslowly.com/game/physics/circle_pair_response_2d.js"></script>
<script>
(function () {
  "use strict";
  const result_element = document.getElementById("result");
  function show(value) {
    result_element.textContent = typeof value === "string" ? value : JSON.stringify(value, null, 2);
  }
  function report_error(error) {
    show("操作失敗：" + error.message);
    console.error(error);
  }

  const canvas=document.getElementById('canvas');const context=canvas.getContext('2d');
  document.getElementById('solve').addEventListener('click',()=>{
    try{
      const first={x:100,y:45,radius:22,vx:Number(document.getElementById('speed_a').value),vy:0};
      const second={x:140,y:45,radius:22,vx:Number(document.getElementById('speed_b').value),vy:0};
      const response=SlowlyCirclePairResponse2D.resolve_pair(first,second,{
        first_mass:Number(document.getElementById('mass_a').value),
        second_mass:Number(document.getElementById('mass_b').value),
        restitution:Number(document.getElementById('restitution').value)
      });
      context.clearRect(0,0,canvas.width,canvas.height);
      for(const ball of [response.first,response.second]){
        context.beginPath();context.arc(ball.x,ball.y,ball.radius,0,Math.PI*2);context.stroke();
      }
      show(response);
    }catch(error){report_error(error);}
  });document.getElementById('solve').click();

})();
</script>
</body>
</html>
