<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lineart Test</title>
<style>
  body{
    margin:0;
    padding:16px;
    background:#eee;
    font-family:sans-serif;
  }

  .controls{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:8px;
    font-size:12px;
  }

  canvas{
    display:block;
    margin-top:16px;
    background:#fff;
    max-width:100%;
  }
</style>
</head>
<body>

<div class="controls">
  <input id="file" type="file" accept="image/*">

  <label>
    TH：
    <input id="th" type="number" value="12" min="1" max="255" style="width:60px">
  </label>
</div>

<canvas id="c"></canvas>

<script src="./lineart.js"></script>
<script>
const fileInput = document.getElementById("file");
const thInput = document.getElementById("th");
const canvas = document.getElementById("c");

let lastImg = null;
let objectUrl = null;

fileInput.onchange = () => {
  const file = fileInput.files[0];
  if (!file) return;

  if (objectUrl) {
    URL.revokeObjectURL(objectUrl);
  }

  objectUrl = URL.createObjectURL(file);

  const img = new Image();

  img.onload = () => {
    lastImg = img;
    draw();
  };

  img.src = objectUrl;
};

thInput.oninput = () => {
  if (lastImg) {
    draw();
  }
};

function draw() {
  Lineart.draw(lastImg, canvas, {
    threshold: Number(thInput.value) || 12
  });
}
</script>

</body>
</html>
