  <nav><a href="card_instance_identity_usage.html">使用說明</a> <a href="card_instance_identity_demo.html">Demo 展示</a> <a href="test_card_instance_identity.html">功能測試</a></nav>
  <h1>卡牌實體身分｜功能測試</h1>
  <p>分辨卡種和實體卡，建立實體卡、查找、依卡種分組及找出重複身分。</p>

  <section>
    <h2>獨立測試結果</h2>
    <p>下列斷言使用目前頁面引入的實際零件執行，而不是預先寫好的 PASS 字樣。</p>
    <pre id="testResults" aria-live="polite"></pre>
  </section>
  
  <script src="./card_instance_identity.js"></script>
  <script>
    const testLines = [];
    let failureCount = 0;

    function verify(description, condition) {
      const passed = Boolean(condition);
      if (!passed) {
        failureCount += 1;
      }
      testLines.push((passed ? "PASS  " : "FAIL  ") + description);
    }

    function throwsError(callback) {
      try {
        callback();
        return false;
      } catch (error) {
        return true;
      }
    }

    try {
      const definition = { cardId: "sun" };
      const firstCard = CardInstanceIdentity.createCardInstance(definition, "sun-1");
      const secondCard = CardInstanceIdentity.createCardInstance(definition, "sun-2");
      verify("建立卡牌不改原始資料", definition.id === undefined);
      verify("能查找實體卡", CardInstanceIdentity.findByInstanceId([firstCard, secondCard], "sun-2") === secondCard);
      verify("同卡種正確分組", CardInstanceIdentity.groupByCardType([firstCard, secondCard]).get("sun").length === 2);
      verify("發現重複身分", CardInstanceIdentity.findDuplicateInstanceIds([firstCard, firstCard]).length === 1);
    } catch (error) {
      failureCount += 1;
      testLines.push("FAIL  測試執行錯誤：" + error.message);
    }

    testLines.push("");
    testLines.push(failureCount === 0 ? "ALL PASS" : failureCount + " FAILED");
    const resultElement = document.getElementById("testResults");
    resultElement.textContent = testLines.join("\n");
    resultElement.className = failureCount === 0 ? "pass" : "fail";
  </script>
</body>
