<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trick Taking Rules｜跟花色與吃墩｜Demo</title>
<style>
  .grid { display: grid; grid-template-columns: repeat(var(--columns, 5), minmax(32px, 42px)); gap: 3px; margin: 12px 0; }
  .cell { min-height: 37px; touch-action: manipulation; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 10px 0; }
  canvas { border: 1px solid; max-width: 100%; }
  output, pre { display: block; white-space: pre-wrap; margin: 10px 0; }
  button { padding: 5px; }
</style>
</head>
<body>
<h1>Trick Taking Rules｜跟花色與吃墩</h1>
<p>本頁直接呼叫軍火庫零件；只提供辨識與操作必要的尺寸／排列。</p>

<p>本墩首牌：玩家 A 的 梅花 2（C2）。從下方選一張手牌，觀察跟花色限制與墩勝者。</p>
<div class="row" id="hand"></div>
<div class="row"><button id="reset">重設</button><label><input id="hearts_points" type="checkbox" checked>示範紅心扣分</label></div>

<output id="result" aria-live="polite"></output>
<script src="https://lib.stillnessbyslowly.com/game/card/trick_taking_rules.js"></script>
<script>
(function () {
  "use strict";
  const result_element = document.getElementById("result");
  function show(value) {
    result_element.textContent = typeof value === "string" ? value : JSON.stringify(value, null, 2);
  }
  function report_error(error) {
    show("操作失敗：" + error.message);
    console.error(error);
  }

  const element=document.getElementById('hand');
  let hand=[];let trick=[];
  function render(){
    element.replaceChildren();
    const legal=SlowlyTrickTakingRules.legal_cards(hand,trick);
    for(const card of hand){
      const button=document.createElement('button');button.textContent=`${card.suit}${card.rank}`;
      button.disabled=!legal.includes(card);
      button.addEventListener('click',()=>{
        trick.push({player:'B',card});hand=hand.filter(item=>item!==card);
        const response=SlowlyTrickTakingRules.resolve_trick(trick,{score_card:item=>
          document.getElementById('hearts_points').checked&&item.suit==='H'?1:0});
        show({trick,legal_before:legal,winner:response.winner,points:response.points});render();
      });element.appendChild(button);
    }
    if(trick.length===1)show({trick,legal_cards:legal});
  }
  function reset(){hand=[{suit:'H',rank:14},{suit:'C',rank:10},{suit:'C',rank:4},{suit:'S',rank:12}];trick=[{player:'A',card:{suit:'C',rank:2}}];render();}
  document.getElementById('reset').addEventListener('click',reset);reset();

})();
</script>
</body>
</html>
