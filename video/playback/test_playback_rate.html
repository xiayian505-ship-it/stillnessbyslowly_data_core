<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Playback Rate Test</title></head>
<body>
<h1>Playback Rate — 功能測試</h1>
<p>純測試頁，沒有自訂 CSS。單獨載入本零件；測試用的 DOM 操作不是積木的一部分。</p>
<label>選擇本機影片（不會上傳）：<input id="file" type="file" accept="video/*"></label>
<p><video id="video" controls playsinline width="360"></video></p><p><button id="half">0.5x</button> <button id="normal">1x</button> <button id="double">2x</button></p>
<pre id="out" aria-live="polite"></pre>
<script src="./playback_rate.js"></script>
<script>
"use strict";
const out = document.getElementById("out");
const video=document.querySelector("#video");let source="";
document.querySelector("#file").onchange = e => { if(source) URL.revokeObjectURL(source); const f=e.target.files[0]; if(!f)return; source=URL.createObjectURL(f);video.src=source;video.load();out.textContent="已載入："+f.name; };
window.addEventListener("pagehide",()=>{if(source) URL.revokeObjectURL(source);});for(const [id,n] of [["half",0.5],["normal",1],["double",2]])document.getElementById(id).onclick=()=>{out.textContent="目前倍速："+SlowlyVideoPlaybackRate.set(video,n);};
</script>
</body></html>
