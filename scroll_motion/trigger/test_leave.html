<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Leave | 慢慢軍火庫測試</title><style>body{margin:0;color:#243047;font-family:system-ui,"Microsoft JhengHei",sans-serif;line-height:1.7;background:#f0f4f9;} main{max-width:960px;margin:auto;padding:32px 20px;}h1{font-size:clamp(1.5rem,4vw,2.25rem);line-height:1.2}code{font-size:.9em} .intro{min-height:82vh;padding:30px;box-sizing:border-box;background:linear-gradient(150deg,#fff,#dceafe)}.card{width:min(360px,82vw);box-sizing:border-box;padding:24px;border-radius:18px;background:#fff;box-shadow:0 10px 26px #0c345226;font-weight:700;font-size:1.4rem;text-align:center}.spacer{height:95vh}.end{min-height:70vh;background:#dceafe;padding:40px 24px}.tag{background:#e8efff;padding:3px 7px;border-radius:5px}
</style></head><body><header class="intro"><main><h1>Trigger / Leave</h1><p>先捲到目標，再往下使其離開畫面。離開後文字會變色，捲回來會復原。</p></main></header><div id="watch" class="card" style="margin:40px auto">我還沒離開</div><div style="min-height:160vh"></div><script src="./leave.js"></script><script>SlowlyScrollLeave.attach('#watch');const el=document.querySelector('#watch');new MutationObserver(()=>{el.textContent=el.classList.contains('has-left-viewport')?'已經離開畫面':'我還在畫面裡';el.style.background=el.classList.contains('has-left-viewport')?'#ffcdaa':'white';}).observe(el,{attributes:true,attributeFilter:['class']});</script></body></html>
