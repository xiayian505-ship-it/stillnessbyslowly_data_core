<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>PNG Download 功能測試</title>
</head>
<body>
  <h1>PNG Download 功能測試</h1>
  <canvas id="canvas" width="240" height="120" style="border:1px solid #ccc"></canvas>
  <p>
    <button id="blobBtn">Blob 下載</button>
    <button id="urlBtn">Data URL 下載</button>
  </p>

  <script src="./canvas_png.js"></script>
  <script src="./png_download.js"></script>
  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    ctx.fillStyle = "#edf5f6";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#1f2c30";
    ctx.font = "20px sans-serif";
    ctx.fillText("PNG Download", 42, 68);

    document.getElementById("blobBtn").onclick = async () => {
      const blob = await SlowlyCanvasPNG.toBlob(canvas);
      SlowlyPNGDownload.fromBlob(blob, "blob_test.png");
    };

    document.getElementById("urlBtn").onclick = () => {
      const dataURL = SlowlyCanvasPNG.toDataURL(canvas);
      SlowlyPNGDownload.fromDataURL(dataURL, "data_url_test.png");
    };
  </script>
</body>
</html>
