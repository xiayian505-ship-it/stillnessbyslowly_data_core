  <nav><a href="card_loadout_validation_usage.html">使用說明</a> <a href="card_loadout_validation_demo.html">Demo 展示</a> <a href="test_card_loadout_validation.html">功能測試</a></nav>
  <h1>出戰清單驗證｜功能測試</h1>
  <p>根據收藏中的實體卡 ID 還原出戰清單，檢查遺失、重複、資格與宿主設定的數量上限。</p>

  <section>
    <h2>獨立測試結果</h2>
    <p>下列斷言使用目前頁面引入的實際零件執行，而不是預先寫好的 PASS 字樣。</p>
    <pre id="testResults" aria-live="polite"></pre>
  </section>
  
  <script src="./card_loadout_validation.js"></script>
  <script>
    const testLines = [];
    let failureCount = 0;

    function verify(description, condition) {
      const passed = Boolean(condition);
      if (!passed) {
        failureCount += 1;
      }
      testLines.push((passed ? "PASS  " : "FAIL  ") + description);
    }

    function throwsError(callback) {
      try {
        callback();
        return false;
      } catch (error) {
        return true;
      }
    }

    try {
      const ownedCards = [{ id: "a" }, { id: "b" }];
      const validSelection = CardLoadoutValidation.validateSelection(ownedCards, ["b", "a"], { maximumCards: 2 });
      verify("合法清單通過", validSelection.isValid);
      verify("保留宿主選牌順序", CardLoadoutValidation.getInstanceIds(validSelection.resolvedCards).join(",") === "b,a");
      const invalidSelection = CardLoadoutValidation.validateSelection(ownedCards, ["a", "a", "missing"], { maximumCards: 2 });
      verify("重複及遺失皆回報", invalidSelection.duplicateInstanceIds.length === 1 && invalidSelection.missingInstanceIds.length === 1);
      verify("超過宿主上限會被拒絕", invalidSelection.exceedsMaximum && !invalidSelection.isValid);
      verify("不會修改收藏清單", ownedCards.length === 2);
    } catch (error) {
      failureCount += 1;
      testLines.push("FAIL  測試執行錯誤：" + error.message);
    }

    testLines.push("");
    testLines.push(failureCount === 0 ? "ALL PASS" : failureCount + " FAILED");
    const resultElement = document.getElementById("testResults");
    resultElement.textContent = testLines.join("\n");
    resultElement.className = failureCount === 0 ? "pass" : "fail";
  </script>
</body>
