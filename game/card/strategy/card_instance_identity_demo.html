<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>卡牌實體身分｜Demo｜慢慢軍火庫</title>
  <style>
    :root { font-family: system-ui, sans-serif; color-scheme: light; }
    body { max-width: 980px; margin: 24px auto; padding: 0 18px 40px; line-height: 1.65; }
    h1 { line-height: 1.25; }
    nav a { margin-right: 18px; }
    section { margin: 30px 0; }
    code, pre { font-family: ui-monospace, Consolas, monospace; }
    pre { padding: 14px; border: 1px solid #d7d7d7; background: #f7f7f7; white-space: pre; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #c9c9c9; padding: 9px; text-align: left; vertical-align: top; }
    th { background: #f2f2f2; }
    .controls { display: flex; flex-wrap: wrap; gap: 10px; }
    button { padding: 8px 12px; cursor: pointer; }
    .note { border-left: 3px solid #777; padding-left: 14px; }
    .pass { color: #176739; }
    .fail { color: #a61b1b; }
  </style>
</head>
<body>
  <nav><a href="card_instance_identity_usage.html">使用說明</a> <a href="card_instance_identity_demo.html">Demo 展示</a> <a href="test_card_instance_identity.html">功能測試</a></nav>
  <h1>卡牌實體身分｜Demo</h1>
  <p>分辨卡種和實體卡，建立實體卡、查找、依卡種分組及找出重複身分。</p>

  <section>
    <h2>可操作示範</h2>
    <p>以下資料與操作僅用於展示積木 API；不是《霧林之契》，也不是策略系卡牌完成品。</p>
    <div class="controls">
      <button type="button" data-action="create">產生兩張卡</button>
      <button type="button" data-action="group">依卡種分組</button>
      <button type="button" data-action="duplicate">檢查重複 ID</button>
    </div>
    <h3>目前結果</h3>
    <pre id="demoOutput" aria-live="polite"></pre>
  </section>
  
  <script src="./card_instance_identity.js"></script>
  <script>
    const stoneDefinition = { cardId: "stone", name: "石之卡" };
    const cards = [
      CardInstanceIdentity.createCardInstance(stoneDefinition, "stone-001"),
      CardInstanceIdentity.createCardInstance(stoneDefinition, "stone-002"),
      CardInstanceIdentity.createCardInstance({ cardId: "wind", name: "風之卡" }, "wind-001")
    ];

    function runDemo(actionName) {
      if (actionName === "create") {
        return cards;
      }

      if (actionName === "group") {
        return Array.from(CardInstanceIdentity.groupByCardType(cards), ([cardTypeId, groupedCards]) => ({
          cardTypeId,
          count: groupedCards.length
        }));
      }

      return CardInstanceIdentity.findDuplicateInstanceIds([...cards, cards[0]]);
    }

    const outputElement = document.getElementById("demoOutput");

    // Demo 的按鈕和狀態顯示都只屬於本頁，不包含在零件本身。
    function showDemoResult(actionName) {
      try {
        const demoResult = runDemo(actionName);
        outputElement.textContent = JSON.stringify(demoResult, null, 2);
      } catch (error) {
        outputElement.textContent = error.name + ": " + error.message;
      }
    }

    document.querySelectorAll("[data-action]").forEach(function (buttonElement) {
      buttonElement.addEventListener("click", function () {
        showDemoResult(buttonElement.dataset.action);
      });
    });

    showDemoResult("create");
  </script>
</body>
</html>
