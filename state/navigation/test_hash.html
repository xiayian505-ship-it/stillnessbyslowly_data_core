<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Navigation Hash 功能測試</title>
<style>
body {
  font-family: Arial, "Microsoft JhengHei", sans-serif;
  margin: 24px;
  line-height: 1.6;
}
button, input {
  margin: 4px 4px 4px 0;
  padding: 6px 10px;
}
pre {
  padding: 12px;
  background: #f3f3f3;
  white-space: pre-wrap;
  word-break: break-word;
}
</style>
</head>
<body>
<h1>Navigation Hash 功能測試</h1>

<input id="value" value="chapter-2">
<button id="run">測試字串</button>
<button id="go">go()</button>
<button id="clear">clear()</button>
<pre id="output"></pre>

<script src="./hash.js"></script>
<script>

const input = document.getElementById("value");
const output = document.getElementById("output");

function run() {
  const value = input.value;
  output.textContent = JSON.stringify({
    version: SlowlyNavigationHash.version,
    normalized: SlowlyNavigationHash.normalizeHash(value),
    current: SlowlyNavigationHash.get(),
    currentValue: SlowlyNavigationHash.value(),
    setOnUrl: SlowlyNavigationHash.set(location.href, value),
    removed: SlowlyNavigationHash.remove(location.href),
    matches: SlowlyNavigationHash.matches(value, "#" + value)
  }, null, 2);
}

document.getElementById("run").onclick = run;
document.getElementById("go").onclick = () => {
  SlowlyNavigationHash.go(input.value);
  run();
};
document.getElementById("clear").onclick = () => {
  SlowlyNavigationHash.clear();
  run();
};

run();

</script>
</body>
</html>
