<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ready Test</title></head>
<body>
<h1>Ready — 功能測試</h1>
<p>純測試頁，沒有自訂 CSS。單獨載入本零件；測試用的 DOM 操作不是積木的一部分。</p>
<label>選擇本機影片（不會上傳）：<input id="file" type="file" accept="video/*"></label>
<p><video id="video" controls playsinline width="360"></video></p><p><button id="wait">等待影片可播放</button></p>
<pre id="out" aria-live="polite"></pre>
<script src="./ready.js"></script>
<script>
"use strict";
const out = document.getElementById("out");
const video=document.querySelector("#video");let source="";
document.querySelector("#file").onchange = e => { if(source) URL.revokeObjectURL(source); const f=e.target.files[0]; if(!f)return; source=URL.createObjectURL(f);video.src=source;video.load();out.textContent="已載入："+f.name; };
window.addEventListener("pagehide",()=>{if(source) URL.revokeObjectURL(source);});document.getElementById("wait").onclick=async()=>{out.textContent="等待中...";try{await SlowlyVideoReady.wait(video,{timeoutMs:5000});out.textContent="影片 readyState="+video.readyState;}catch(e){out.textContent=e.message;}};
</script>
</body></html>
