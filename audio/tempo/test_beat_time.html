<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Beat Time 功能測試</title>
<style>
body{font-family:Arial,"Microsoft JhengHei",sans-serif;margin:32px;line-height:1.7}
.test{max-width:760px;padding:12px 14px;margin:10px 0;border:1px solid #d6ddd1}
.pass{background:#edf8ef}.fail{background:#fff0f0}
</style>
</head>
<body>
<h1>Beat Time 功能測試</h1>
<div id="results"></div>

<script src="./beat_time.js"></script>
<script>
(function(){
  var root = document.getElementById("results");

  function check(name, actual, expected, tolerance){
    var pass = Math.abs(actual - expected) <= (tolerance || 0);
    var box = document.createElement("div");
    box.className = "test " + (pass ? "pass" : "fail");
    box.textContent =
      (pass ? "PASS｜" : "FAIL｜") +
      name +
      "｜actual=" + actual +
      "｜expected=" + expected;
    root.appendChild(box);
  }

  check(
    "120 BPM 每拍 0.5 秒",
    BeatTime.secondsPerBeat(120),
    0.5
  );

  check(
    "8 拍 @ 120 BPM = 4 秒",
    BeatTime.beatsToSeconds(8, 120),
    4
  );

  check(
    "3 秒 @ 90 BPM = 4.5 拍",
    BeatTime.secondsToBeats(3, 90),
    4.5,
    0.000001
  );

  check(
    "往返換算",
    BeatTime.secondsToBeats(
      BeatTime.beatsToSeconds(7.25, 135),
      135
    ),
    7.25,
    0.000001
  );
})();
</script>
</body>
</html>
