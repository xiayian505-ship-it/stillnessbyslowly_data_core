<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Vertical to Horizontal | 慢慢軍火庫測試</title><style>body{margin:0;color:#243047;font-family:system-ui,"Microsoft JhengHei",sans-serif;line-height:1.7;background:#f0f4f9;} main{max-width:960px;margin:auto;padding:32px 20px;}h1{font-size:clamp(1.5rem,4vw,2.25rem);line-height:1.2}code{font-size:.9em} .intro{min-height:82vh;padding:30px;box-sizing:border-box;background:linear-gradient(150deg,#fff,#dceafe)}.card{width:min(360px,82vw);box-sizing:border-box;padding:24px;border-radius:18px;background:#fff;box-shadow:0 10px 26px #0c345226;font-weight:700;font-size:1.4rem;text-align:center}.spacer{height:95vh}.end{min-height:70vh;background:#dceafe;padding:40px 24px}.tag{background:#e8efff;padding:3px 7px;border-radius:5px}
</style><link rel="stylesheet" href="./vertical_to_horizontal.css"></head><body><header class="intro"><main><h1>Horizontal / Vertical to Horizontal</h1><p>繼續往下滑，這一區會保持在視窗內，卡片由右往左走。動畫結束後，頁面繼續向下。</p><p>若開啟減少動態效果，會改為一般橫向滑動。</p></main></header><section id="hscroll" class="slowly-vth"><div class="slowly-vth-viewport"><div class="slowly-vth-track"><article style="width:90vw;height:100vh;box-sizing:border-box;display:grid;place-items:center;background:hsl(222 75% 86%);border-right:3px solid white"><div class="card">Panel 1</div></article><article style="width:90vw;height:100vh;box-sizing:border-box;display:grid;place-items:center;background:hsl(254 75% 86%);border-right:3px solid white"><div class="card">Panel 2</div></article><article style="width:90vw;height:100vh;box-sizing:border-box;display:grid;place-items:center;background:hsl(286 75% 86%);border-right:3px solid white"><div class="card">Panel 3</div></article><article style="width:90vw;height:100vh;box-sizing:border-box;display:grid;place-items:center;background:hsl(318 75% 86%);border-right:3px solid white"><div class="card">Panel 4</div></article></div></div></section><footer class="end">橫向展示結束，可以繼續往下。</footer><script src="./vertical_to_horizontal.js"></script><script>SlowlyVerticalToHorizontal.attach('#hscroll');</script></body></html>
