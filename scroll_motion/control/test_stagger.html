</style><link rel="stylesheet" href="../motion/fade.css"></head><body><header class="intro"><main><h1>Control / Stagger</h1><p>依序進場；本零件只設定每張卡片的 delay，觸發仍使用原有的 SlowlyReveal。</p></main></header><div style="min-height:80vh;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-evenly;gap:16px"><div class="card slowly-motion-fade" data-slowly-reveal>Stagger 1</div><div class="card slowly-motion-fade" data-slowly-reveal>Stagger 2</div><div class="card slowly-motion-fade" data-slowly-reveal>Stagger 3</div></div><div class="end">測試完畢</div><script src="./stagger.js"></script><script src="../../effects/reveal/auto_reveal.js"></script><script>SlowlyScrollStagger.attach('[data-slowly-reveal]',{step:220});SlowlyReveal.create({once:false,threshold:0.25});</script></body></html>
