<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Grid Line Match｜功能測試</title>
  <style>
    body{font-family:system-ui,sans-serif;max-width:820px;margin:32px auto;padding:0 16px;line-height:1.7}
    .pass{color:#176b3a}.fail{color:#a02d2d} code{font-family:ui-monospace,monospace}
  </style>
</head>
<body>
  <h1>Grid Line Match｜功能測試</h1>
  <div id="results"></div>

  <script src="./line_match.js"></script>
  <script>
    "use strict";

    const results = document.getElementById("results");

    function test(name, fn) {
      const row = document.createElement("p");
      try {
        fn();
        row.className = "pass";
        row.textContent = `PASS｜${name}`;
      } catch (error) {
        row.className = "fail";
        row.textContent = `FAIL｜${name}｜${error.message}`;
      }
      results.appendChild(row);
    }

    function assert(condition, message) {
      if (!condition) throw new Error(message || "assert failed");
    }

    test("橫向三連", () => {
      const result = SlowlyGridLineMatch.find([
        [1, 1, 1, 2],
        [2, 3, 4, 5]
      ]);
      assert(result.groups.length === 1);
      assert(result.groups[0].type === "h");
      assert(result.groups[0].len === 3);
    });

    test("縱向四連", () => {
      const result = SlowlyGridLineMatch.find([
        [7, 1],
        [7, 2],
        [7, 3],
        [7, 4]
      ], { minLength: 4 });
      assert(result.groups.length === 1);
      assert(result.groups[0].type === "v");
      assert(result.groups[0].len === 4);
    });

    test("blocked 會中斷連線", () => {
      const result = SlowlyGridLineMatch.find([
        [1, 1, null, 1, 1, 1]
      ], {
        isBlocked: cell => cell === null
      });
      assert(result.groups.length === 1);
      assert(result.groups[0].cells[0].c === 3);
    });

    test("支援物件格子與 getValue", () => {
      const grid = [[
        { c: 2, sp: null },
        { c: 2, sp: null },
        { c: 2, sp: null },
        { c: 2, sp: "b" }
      ]];

      const result = SlowlyGridLineMatch.find(grid, {
        getValue: cell => cell.c,
        isBlocked: cell => cell.sp === "b"
      });

      assert(result.groups.length === 1);
      assert(result.groups[0].value === 2);
      assert(result.groups[0].len === 3);
    });

    test("沒有連線時回傳空 groups", () => {
      const result = SlowlyGridLineMatch.find([
        [1, 2, 3],
        [2, 3, 1],
        [3, 1, 2]
      ]);
      assert(Array.isArray(result.groups));
      assert(result.groups.length === 0);
    });

    test("非矩形 grid 會丟錯", () => {
      let thrown = false;
      try {
        SlowlyGridLineMatch.find([[1, 2], [1]]);
      } catch (error) {
        thrown = true;
      }
      assert(thrown);
    });
  </script>
</body>
</html>
