<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar 功能測試</title>

  <link rel="stylesheet" href="https://lib.stillnessbyslowly.com/ui/responsive.css">

  <style>
    :root {
      --bg: #f4f5f5;
      --surface: #ffffff;
      --text: #202426;
      --muted: #687176;
      --line: #d9dddf;
      --accent: #536d78;
      --success: #4f7a61;
      --danger: #9b4d4d;
      --content: 900px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, "Microsoft JhengHei", sans-serif;
    }

    button, input { font: inherit; }

    main {
      width: min(calc(100% - 32px), var(--content));
      margin: 0 auto;
      padding: 56px 0 72px;
    }

    h1 { margin: 0 0 10px; }

    .intro {
      margin: 0 0 28px;
      color: var(--muted);
      line-height: 1.7;
    }

    .panel {
      margin-bottom: 18px;
      padding: 18px;
      border: 1px solid var(--line);
      background: var(--surface);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: end;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    input, button {
      min-height: 42px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
    }

    button { cursor: pointer; }

    pre {
      margin: 14px 0 0;
      padding: 14px;
      overflow: auto;
      background: var(--bg);
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .summary {
      font-weight: 700;
      margin-bottom: 12px;
    }

    .test {
      padding: 8px 0;
      border-bottom: 1px solid var(--line);
      line-height: 1.5;
    }

    .test:last-child { border-bottom: 0; }
    .pass { color: var(--success); }
    .fail { color: var(--danger); }

    @media (max-width: 600px) {
      main {
        width: min(calc(100% - 20px), var(--content));
        padding: 36px 0 52px;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>Calendar 功能測試</h1>
    <p class="intro">
      測試 Calendar 是否能正確生成西曆年月日結構，並整合 Lunar 與 SolarTerms。
    </p>

    <section class="panel">
      <div class="controls">
        <div>
          <label for="year">年份</label>
          <input id="year" type="number" min="1901" max="2100" value="2027">
        </div>

        <div>
          <label for="month">月份</label>
          <input id="month" type="number" min="1" max="12" value="1">
        </div>

        <button id="showMonth" type="button">查看月份資料</button>
      </div>

      <pre id="output">載入中…</pre>
    </section>

    <section class="panel">
      <div id="summary" class="summary"></div>
      <div id="tests"></div>
    </section>
  </main>

  <script src="https://lib.stillnessbyslowly.com/calendar/lunar_data.js"></script>
  <script src="https://lib.stillnessbyslowly.com/calendar/lunar.js"></script>
  <script src="https://lib.stillnessbyslowly.com/calendar/solar_terms_data.js"></script>
  <script src="https://lib.stillnessbyslowly.com/calendar/solar_terms.js"></script>
  <script src="./calendar.js"></script>

  <script>
    (function () {
      "use strict";

      const output = document.getElementById("output");
      const testsEl = document.getElementById("tests");
      const summaryEl = document.getElementById("summary");

      function showMonth() {
        try {
          const year = Number(document.getElementById("year").value);
          const month = Number(document.getElementById("month").value);
          const data = Calendar.getMonth(year, month);
          output.textContent = JSON.stringify(data, null, 2);
        } catch (error) {
          output.textContent = error.name + ": " + error.message;
        }
      }

      document.getElementById("showMonth").addEventListener("click", showMonth);

      const results = [];

      function test(name, fn) {
        try {
          const detail = fn();
          results.push({ name: name, pass: true, detail: detail || "" });
        } catch (error) {
          results.push({
            name: name,
            pass: false,
            detail: error.name + ": " + error.message
          });
        }
      }

      function assert(condition, message) {
        if (!condition) {
          throw new Error(message);
        }
      }

      test("Calendar v1.0.0 已載入", function () {
        assert(window.Calendar, "Calendar 不存在");
        assert(Calendar.VERSION === "1.0.0", "版本不是 1.0.0");
      });

      test("支援範圍為 1901–2100", function () {
        assert(Calendar.isSupportedYear(1901), "1901 應支援");
        assert(Calendar.isSupportedYear(2100), "2100 應支援");
        assert(!Calendar.isSupportedYear(1900), "1900 不應支援");
        assert(!Calendar.isSupportedYear(2101), "2101 不應支援");
      });

      test("2027 年有 12 個月", function () {
        assert(Calendar.getYear(2027).months.length === 12, "不是 12 個月");
      });

      test("2027 年 1 月有 31 天", function () {
        assert(Calendar.getMonth(2027, 1).daysInMonth === 31, "不是 31 天");
      });

      test("2027-01-01 是星期五", function () {
        const day = Calendar.createDay(2027, 1, 1);
        assert(day.weekday === 5, "weekday 應為 5");
      });

      test("2027 年 1 月 firstWeekday = 5", function () {
        assert(Calendar.getFirstWeekday(2027, 1) === 5, "應為星期五");
      });

      test("2027-01-01 農曆為廿四", function () {
        const day = Calendar.createDay(2027, 1, 1);
        assert(day.lunar, "沒有 Lunar 資料");
        assert(day.lunar.day === 24, "農曆日不是 24");
      });

      test("2027-01-08 為農曆十二月初一", function () {
        const day = Calendar.createDay(2027, 1, 8);
        assert(day.lunar, "沒有 Lunar 資料");
        assert(day.lunar.month === 12, "農曆月份不是 12");
        assert(day.lunar.day === 1, "農曆日期不是初一");
      });

      test("2027-02-06 為農曆正月初一", function () {
        const day = Calendar.createDay(2027, 2, 6);
        assert(day.lunar, "沒有 Lunar 資料");
        assert(day.lunar.month === 1, "農曆月份不是 1");
        assert(day.lunar.day === 1, "農曆日期不是初一");
      });

      test("2026-01-05 可整合小寒", function () {
        const day = Calendar.createDay(2026, 1, 5);
        assert(day.solarTerm, "沒有節氣資料");

        const term = Array.isArray(day.solarTerm)
          ? day.solarTerm[0]
          : day.solarTerm;

        assert(term.name === "小寒", "節氣不是小寒");
      });

      test("一般日期 solarTerm 為 null", function () {
        const day = Calendar.createDay(2026, 1, 6);
        assert(day.solarTerm === null, "一般日期不應有節氣");
      });

      test("2024 年 2 月有 29 天", function () {
        assert(Calendar.getDaysInMonth(2024, 2) === 29, "閏年 2 月應為 29 天");
      });

      test("2027 年 2 月有 28 天", function () {
        assert(Calendar.getDaysInMonth(2027, 2) === 28, "平年 2 月應為 28 天");
      });

      test("拒絕 1900", function () {
        let rejected = false;

        try {
          Calendar.getYear(1900);
        } catch (error) {
          rejected = error instanceof RangeError;
        }

        assert(rejected, "1900 應被拒絕");
      });

      test("拒絕 2101", function () {
        let rejected = false;

        try {
          Calendar.getYear(2101);
        } catch (error) {
          rejected = error instanceof RangeError;
        }

        assert(rejected, "2101 應被拒絕");
      });

      test("拒絕不存在的月份", function () {
        let rejected = false;

        try {
          Calendar.getMonth(2027, 13);
        } catch (error) {
          rejected = error instanceof RangeError;
        }

        assert(rejected, "13 月應被拒絕");
      });

      test("拒絕不存在的日期", function () {
        let rejected = false;

        try {
          Calendar.createDay(2027, 2, 29);
        } catch (error) {
          rejected = error instanceof RangeError;
        }

        assert(rejected, "2027-02-29 應被拒絕");
      });

      test("getYear 每月天數合計為 365", function () {
        const year = Calendar.getYear(2027);
        const total = year.months.reduce(function (sum, month) {
          return sum + month.days.length;
        }, 0);

        assert(total === 365, "2027 應為 365 天");
      });

      const passed = results.filter(function (item) {
        return item.pass;
      }).length;

      summaryEl.textContent =
        passed + "/" + results.length +
        " PASS，" + (results.length - passed) + " FAIL";

      results.forEach(function (result) {
        const el = document.createElement("div");
        el.className = "test " + (result.pass ? "pass" : "fail");
        el.textContent =
          (result.pass ? "PASS — " : "FAIL — ") +
          result.name +
          (result.detail ? " — " + result.detail : "");
        testsEl.appendChild(el);
      });

      showMonth();
    })();
  </script>
</body>
</html>
