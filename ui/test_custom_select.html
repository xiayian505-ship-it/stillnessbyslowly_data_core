<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Custom Select Test</title>

  <link rel="stylesheet" href="./custom_select.css">

  <style>
    body{
      margin:20px;
      font-family:system-ui,sans-serif;
      background:#fff;
      color:#000;
    }

    main{
      max-width:640px;
    }

    section{
      margin:0 0 28px;
      padding:16px 0;
      border-top:1px solid #000;
    }

    label{
      display:block;
      margin-bottom:8px;
    }

    .test-row{
      max-width:320px;
    }

    .test-button{
      margin-top:10px;
      padding:8px 10px;
      border:1px solid #000;
      border-radius:0;
      background:#fff;
      color:#000;
      font:inherit;
    }

    pre{
      min-height:48px;
      padding:10px;
      border:1px solid #000;
      white-space:pre-wrap;
    }
  </style>
</head>

<body>
  <main>
    <h1>Custom Select Test</h1>
    <p>只驗功能，不驗美觀。</p>

    <section>
      <h2>1. 基本切換 / change</h2>

      <div class="test-row">
        <label for="basicSelect">幣別</label>

        <select id="basicSelect">
          <option value="TWD">TWD</option>
          <option value="JPY">JPY</option>
          <option value="USD">USD</option>
        </select>
      </div>

      <pre id="basicLog">value: TWD</pre>
    </section>

    <section>
      <h2>2. 多實例隔離</h2>
      <p>第二顆不應被第一顆改文字；防止「七個花花多付」。</p>

      <div class="test-row">
        <label for="personSelect">誰多付</label>

        <select id="personSelect">
          <option value="A">小米 多付</option>
          <option value="B">花花 多付</option>
        </select>
      </div>

      <br>

      <div class="test-row">
        <label for="currencySelect">幣別</label>

        <select id="currencySelect">
          <option value="TWD">TWD</option>
          <option value="JPY">JPY</option>
          <option value="USD">USD</option>
          <option value="EUR">EUR</option>
          <option value="KRW">KRW</option>
          <option value="CNY">CNY</option>
          <option value="HKD">HKD</option>
        </select>
      </div>
    </section>

    <section>
      <h2>3. 程式改 value 後 sync()</h2>

      <div class="test-row">
        <label for="syncSelect">狀態</label>

        <select id="syncSelect">
          <option value="one">One</option>
          <option value="two">Two</option>
          <option value="three">Three</option>
        </select>
      </div>

      <button type="button" class="test-button" id="setThree">
        程式設為 Three
      </button>
    </section>

    <section>
      <h2>4. 動態修改 option 文字後 sync()</h2>

      <div class="test-row">
        <label for="dynamicSelect">名字</label>

        <select id="dynamicSelect">
          <option value="A">A 多付</option>
          <option value="B">B 多付</option>
        </select>
      </div>

      <button type="button" class="test-button" id="renameOptions">
        改成 小米 / 花花
      </button>
    </section>

    <section>
      <h2>5. disabled</h2>

      <div class="test-row">
        <label for="disabledSelect">停用測試</label>

        <select id="disabledSelect" disabled>
          <option value="A">不能打開</option>
          <option value="B">B</option>
        </select>
      </div>
    </section>
  </main>

  <script src="./custom_select.js"></script>

  <script>
    const basic = SlowlySelect.create("#basicSelect");
    SlowlySelect.create("#personSelect");
    SlowlySelect.create("#currencySelect");
    const syncExample = SlowlySelect.create("#syncSelect");
    const dynamic = SlowlySelect.create("#dynamicSelect");
    SlowlySelect.create("#disabledSelect");

    const basicSelect = document.getElementById("basicSelect");
    const basicLog = document.getElementById("basicLog");

    basicSelect.addEventListener("change", ()=>{
      basicLog.textContent =
        `change fired\nvalue: ${basicSelect.value}`;
    });

    document.getElementById("setThree").addEventListener("click", ()=>{
      document.getElementById("syncSelect").value = "three";
      syncExample.sync();
    });

    document.getElementById("renameOptions").addEventListener("click", ()=>{
      const select = document.getElementById("dynamicSelect");

      select.options[0].textContent = "小米 多付";
      select.options[1].textContent = "花花 多付";

      dynamic.sync();
    });
  </script>
</body>
</html>
