<h1>Biquad Filter</h1>
<p>BiquadFilterNode 的薄包裝，只提供建立、參數設定與連接；不內建特定音效 preset。</p>
<h2>最小使用</h2>
<pre><code>const filter = SlowlyAudioBiquadFilter.create(ctx, {
  type: "lowpass",
  frequency: 1400,
  Q: 1
});

oscillator.connect(filter);
filter.connect(gain);</code></pre>
