<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Navigation Query 功能測試</title>
<style>
body {
  font-family: Arial, "Microsoft JhengHei", sans-serif;
  margin: 24px;
  line-height: 1.6;
}
button, input {
  margin: 4px 4px 4px 0;
  padding: 6px 10px;
}
pre {
  padding: 12px;
  background: #f3f3f3;
  white-space: pre-wrap;
  word-break: break-word;
}
</style>
</head>
<body>
<h1>Navigation Query 功能測試</h1>

<input id="value" value="?chapter=2&mode=demo&tag=a&tag=b">
<button id="run">測試</button>
<pre id="output"></pre>

<script src="./query.js"></script>
<script>

const input = document.getElementById("value");
const output = document.getElementById("output");

function run() {
  const value = input.value;
  output.textContent = JSON.stringify({
    version: SlowlyNavigationQuery.version,
    chapter: SlowlyNavigationQuery.get(value, "chapter"),
    tags: SlowlyNavigationQuery.getAll(value, "tag"),
    hasMode: SlowlyNavigationQuery.has(value, "mode"),
    setChapter: SlowlyNavigationQuery.set(value, "chapter", 3),
    appendTag: SlowlyNavigationQuery.append(value, "tag", "c"),
    removeMode: SlowlyNavigationQuery.remove(value, "mode"),
    object: SlowlyNavigationQuery.toObject(value),
    fromObject: SlowlyNavigationQuery.fromObject({
      chapter: 4,
      tag: ["x", "y"],
      empty: null
    })
  }, null, 2);
}

document.getElementById("run").onclick = run;
run();

</script>
</body>
</html>
