<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Slowly Data Search Sort Component</title>
<link rel="stylesheet" href="https://lib.stillnessbyslowly.com/ui/responsive.css">
<link rel="stylesheet" href="./data_search_sort_component.css">
<style>
body{margin:0;background:#fff;color:#000;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}main{width:min(100% - 32px,900px);margin:0 auto;padding:40px 0}h1{margin:0 0 8px}.note{margin:0 0 32px}#result{margin-top:32px}.demo-item{padding:12px 0;border-bottom:1px solid #ccc}.demo-item:first-child{border-top:1px solid #ccc}.demo-item h2{margin:0 0 4px;font-size:1rem}.demo-item p{margin:0}
</style>
</head>
<body><main>
<h1>Slowly Data Search Sort Component</h1>
<p class="note">Fiction Search + Fiction Sort 組合測試。</p>
<div id="search-sort"></div><div id="result"></div>
</main>
<script src="https://lib.stillnessbyslowly.com/fiction/Fiction_search.js"></script>
<script src="https://lib.stillnessbyslowly.com/fiction/Fiction_sort.js"></script>
<script src="./data_search_sort_component.js"></script>
<script>
const data=[
 {title:"長安客棧夜話",author:"青雀",tags:["古風","江湖"],createdAt:"2026-09-08T10:00:00"},
 {title:"隔壁班的天文社",author:"星野",tags:["校園","青春"],createdAt:"2026-09-06T10:00:00"},
 {title:"龍脊之上",author:"墨言",tags:["奇幻","冒險"],createdAt:"2026-09-07T10:00:00"}
];
const resultElement=document.querySelector("#result");
function renderResult(items){resultElement.innerHTML="";const count=document.createElement("p");count.textContent=`共 ${items.length} 筆`;resultElement.append(count);items.forEach(item=>{const article=document.createElement("article"),title=document.createElement("h2"),author=document.createElement("p");article.className="demo-item";title.textContent=item.title;author.textContent=`作者：${item.author}`;article.append(title,author);resultElement.append(article);});}
SlowlyDataSearchSort.create({target:"#search-sort",data,search:{fields:["title","author","tags"],placeholder:"搜尋標題、作者或標籤"},sort:{defaultValue:"newest",options:[{value:"newest",label:"最新建立",field:"createdAt",direction:"desc",type:"date"},{value:"oldest",label:"最早建立",field:"createdAt",direction:"asc",type:"date"},{value:"title",label:"標題",field:"title",direction:"asc",type:"string"},{value:"author",label:"作者",field:"author",direction:"asc",type:"string"}]},onChange(result){renderResult(result);}});
</script>
</body></html>
