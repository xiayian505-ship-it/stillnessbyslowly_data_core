  <h1>候選目標選擇｜功能測試</h1>
  <p>從宿主提供的卡牌區域收集候選目標，依自訂條件篩選、查找或選取。</p>

  <section>
    <h2>獨立測試結果</h2>
    <p>下列斷言使用目前頁面引入的實際零件執行，而不是預先寫好的 PASS 字樣。</p>
    <pre id="testResults" aria-live="polite"></pre>
  </section>
  
  <script src="./card_target_selection.js"></script>
  <script>
    const testLines = [];
    let failureCount = 0;

    function verify(description, condition) {
      const passed = Boolean(condition);
      if (!passed) {
        failureCount += 1;
      }
      testLines.push((passed ? "PASS  " : "FAIL  ") + description);
    }

    function throwsError(callback) {
      try {
        callback();
        return false;
      } catch (error) {
        return true;
      }
    }

    try {
      const cardZones = [
        { owner: "north", zone: "hand", cards: [{ id: "A" }] },
        { owner: "south", zone: "hand", cards: [{ id: "B" }, { id: "C" }] }
      ];
      const eligibleCandidates = CardTargetSelection.collectCandidates(cardZones, candidate => candidate.owner === "south");
      verify("可以由宿主條件篩選", eligibleCandidates.length === 2);
      verify("來源索引保留", eligibleCandidates[1].cardIndex === 1);
      verify("可以依條件查找", CardTargetSelection.findCandidate(eligibleCandidates, candidate => candidate.card.id === "C").card.id === "C");
      verify("固定亂數可重現選擇", CardTargetSelection.pickRandomCandidate(eligibleCandidates, () => 0).card.id === "B");
      verify("空候選回傳 null", CardTargetSelection.pickRandomCandidate([]) === null);
    } catch (error) {
      failureCount += 1;
      testLines.push("FAIL  測試執行錯誤：" + error.message);
    }

    testLines.push("");
    testLines.push(failureCount === 0 ? "ALL PASS" : failureCount + " FAILED");
    const resultElement = document.getElementById("testResults");
    resultElement.textContent = testLines.join("\n");
    resultElement.className = failureCount === 0 ? "pass" : "fail";
  </script>
</body>
