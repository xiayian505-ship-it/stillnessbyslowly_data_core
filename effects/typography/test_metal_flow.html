<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Slowly Typography Metal Flow Test</title>

<link rel="stylesheet" href="./metallic_text.css">
<link rel="stylesheet" href="./text_gradient_flow.css">
<link rel="stylesheet" href="./text_reflection.css">

<style>
  *{box-sizing:border-box}

  body{
    margin:0;
    min-height:100vh;
    padding:40px 20px;
    background:
      radial-gradient(circle at 20% 20%, rgba(111,147,164,.16), transparent 35%),
      radial-gradient(circle at 80% 15%, rgba(142,127,160,.13), transparent 34%),
      linear-gradient(180deg,#0d1118,#171923 56%,#24232d);
    color:#f4f1eb;
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;
  }

  main{
    width:min(900px,100%);
    margin:0 auto;
  }

  h1{
    margin:0 0 30px;
    font-size:clamp(1.5rem,5vw,2.8rem);
  }

  .grid{
    display:grid;
    gap:14px;
  }

  .demo{
    padding:24px;
    border:1px solid rgba(255,255,255,.12);
    border-radius:12px;
    background:rgba(23,28,38,.88);
  }

  .label{
    margin:0 0 12px;
    color:#aeb5c0;
    font-size:.82rem;
  }

  .sample{
    margin:0;
    font-size:clamp(1.65rem,7vw,4rem);
    font-weight:850;
    letter-spacing:.06em;
    line-height:1.05;
  }

  .plain-reflection{
    color:#aeb5c0;
  }

  .combined{
    --slowly-text-flow-duration:18s;
    --slowly-reflection-duration:18s;
    filter:drop-shadow(0 0 10px rgba(248,243,230,.08));
  }

  .custom-gold{
    --slowly-metallic-gradient:
      linear-gradient(
        115deg,
        #5c4730 0%,
        #b58a4e 14%,
        #fff0b8 28%,
        #8d6735 43%,
        #f8dda0 58%,
        #6b4e2c 75%,
        #d4ab68 100%
      );
  }
</style>
</head>

<body>
<main>
  <h1>Slowly Typography / Metal Flow</h1>

  <div class="grid">

    <section class="demo">
      <p class="label">1. Metallic Text｜只有金屬材質，完全不動</p>
      <p class="sample slowly-metallic-text">SBS | MATCH3_V1</p>
    </section>

    <section class="demo">
      <p class="label">2. Text Gradient Flow｜只有漸層流動</p>
      <p class="sample slowly-text-gradient-flow">SLOW GRADIENT FLOW</p>
    </section>

    <section class="demo">
      <p class="label">3. Text Reflection｜只有反光帶</p>
      <p
        class="sample plain-reflection slowly-text-reflection"
        data-text="SOFT REFLECTION"
      >SOFT REFLECTION</p>
    </section>

    <section class="demo">
      <p class="label">三顆組裝｜Match3 標題方向</p>
      <p
        class="sample combined slowly-metallic-text slowly-text-gradient-flow slowly-text-reflection"
        data-text="SBS | MATCH3_V1"
      >SBS | MATCH3_V1</p>
    </section>

    <section class="demo">
      <p class="label">宿主換材質示範｜金色 Metallic + 另外兩顆照吃</p>
      <p
        class="sample combined custom-gold slowly-metallic-text slowly-text-gradient-flow slowly-text-reflection"
        data-text="STILLNESS BY SLOWLY"
      >STILLNESS BY SLOWLY</p>
    </section>

  </div>
</main>
</body>
</html>
