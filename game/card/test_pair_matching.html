<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pair Matching 功能測試</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0;
    background:#eef1ea;
    color:#263029;
    font-family:Arial,"Microsoft JhengHei",sans-serif;
    line-height:1.7;
  }
  .wrap{
    width:min(680px,100% - 32px);
    margin:0 auto;
    padding:32px 0 56px;
  }
  h1{margin:0 0 6px;font-size:28px}
  .sub{margin:0 0 24px;color:#6d7a71}
  .stats{
    display:flex;
    gap:20px;
    margin-bottom:14px;
    color:#6d7a71;
    font-size:14px;
  }
  .stats strong{color:#263029}
  #board{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
  }
  .card{
    aspect-ratio:1;
    border:0;
    border-radius:12px;
    background:#4f7a5c;
    color:#fff;
    font-size:30px;
    cursor:pointer;
    transition:transform .2s ease,background .2s ease,opacity .2s ease;
  }
  .card:hover{transform:translateY(-2px)}
  .card.is-open{background:#fff;color:#263029;outline:1px solid #d6ddd1}
  .card.is-matched{
    background:#dcece1;
    color:#2f5b3d;
    outline:1px solid #4f7a5c;
    cursor:default;
  }
  .card:disabled{cursor:default}
  .actions{margin-top:18px}
  button.control{
    padding:9px 16px;
    border:1px solid #4f7a5c;
    background:#4f7a5c;
    color:white;
    cursor:pointer;
  }
  #log{
    margin-top:22px;
    padding:14px 16px;
    min-height:52px;
    background:white;
    border:1px solid #d6ddd1;
    color:#465149;
    font-size:14px;
  }
  code{background:#fff;padding:2px 5px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Pair Matching 功能測試</h1>
  <p class="sub">
    這頁只測 <code>pair_matching.js</code>。
    核心只負責「第一次選擇 → 第二次選擇 → 鎖定 → 配對／失敗 → 完成」；
    卡片外觀、延遲與提示文字都由這個宿主頁自己決定。
  </p>

  <div class="stats">
    <span>回合 <strong id="moves">0</strong></span>
    <span>完成配對 <strong id="matched">0</strong> / 3</span>
  </div>

  <div id="board"></div>

  <div class="actions">
    <button class="control" id="restart" type="button">重新開始</button>
  </div>

  <div id="log">請翻兩張牌。</div>
</div>

<script src="./pair_matching.js"></script>
<script>
(function () {
  "use strict";

  var source = [
    { id:"a1", symbol:"🍎" },
    { id:"b1", symbol:"🍎" },
    { id:"a2", symbol:"🍋" },
    { id:"b2", symbol:"🍋" },
    { id:"a3", symbol:"🍇" },
    { id:"b3", symbol:"🍇" }
  ];

  var board = document.getElementById("board");
  var movesEl = document.getElementById("moves");
  var matchedEl = document.getElementById("matched");
  var logEl = document.getElementById("log");
  var engine = null;

  function wait(ms) {
    return new Promise(function (resolve) {
      setTimeout(resolve, ms);
    });
  }

  function shuffledCopy(items) {
    var list = items.slice();
    for (var i = list.length - 1; i > 0; i -= 1) {
      var j = Math.floor(Math.random() * (i + 1));
      var temp = list[i];
      list[i] = list[j];
      list[j] = temp;
    }
    return list;
  }

  function getCard(id) {
    return board.querySelector('[data-id="' + id + '"]');
  }

  function render(items) {
    board.innerHTML = "";

    items.forEach(function (item) {
      var button = document.createElement("button");
      button.type = "button";
      button.className = "card";
      button.dataset.id = item.id;
      button.textContent = "?";

      button.addEventListener("click", function () {
        engine.select(item.id);
      });

      board.appendChild(button);
    });
  }

  function start() {
    var items = shuffledCopy(source);

    render(items);
    movesEl.textContent = "0";
    matchedEl.textContent = "0";
    logEl.textContent = "請翻兩張牌。";

    engine = PairMatching.create({
      items: items,

      getMatchKey: function (item) {
        return item.symbol;
      },

      onSelect: function (event) {
        var card = getCard(event.id);
        card.classList.add("is-open");
        card.textContent = event.item.symbol;
        logEl.textContent = event.selection === 1
          ? "第一張已選，請再選一張。"
          : "正在判定……";
      },

      onMove: function (event) {
        movesEl.textContent = String(event.moves);
      },

      onMatch: async function (event) {
        await wait(250);

        [event.firstId, event.secondId].forEach(function (id) {
          var card = getCard(id);
          card.classList.remove("is-open");
          card.classList.add("is-matched");
          card.disabled = true;
        });

        matchedEl.textContent = String(event.matchedPairs);
        logEl.textContent = "配對成功。";
      },

      onMismatch: async function (event) {
        logEl.textContent = "不同，稍後翻回去。";
        await wait(650);

        [event.firstId, event.secondId].forEach(function (id) {
          var card = getCard(id);
          card.classList.remove("is-open");
          card.textContent = "?";
        });

        logEl.textContent = "請繼續。";
      },

      onComplete: function (event) {
        logEl.textContent = "全部完成，共用了 " + event.moves + " 回合。";
      }
    });
  }

  document.getElementById("restart").addEventListener("click", start);
  start();
})();
</script>
</body>
</html>
