<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slowly Canvas Icon Playground</title>
<style>
  :root{
    --bg:#f4f5f5;
    --surface:#ffffff;
    --text:#202426;
    --muted:#687176;
    --line:#d9dddf;
    --accent:#536d78;
  }

  *{box-sizing:border-box}

  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:Arial,"Microsoft JhengHei",sans-serif;
  }

  main{
    width:min(calc(100% - 32px),980px);
    margin:auto;
    padding:48px 0;
  }

  h1,h2,p{margin-top:0}

  .intro{
    color:var(--muted);
    line-height:1.8;
  }

  .view[hidden]{display:none}

  .family-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:16px;
    margin-top:24px;
  }

  .family-card,
  .icon-card,
  .preview-panel,
  .control-panel{
    border:1px solid var(--line);
    background:var(--surface);
  }

  .family-card{
    display:grid;
    gap:12px;
    padding:16px;
  }

  .family-preview-button,
  .icon-card,
  .back-button,
  .enter-button,
  .reset{
    cursor:pointer;
    font:inherit;
  }

  .family-preview-button{
    display:grid;
    gap:8px;
    width:100%;
    padding:14px;
    border:1px solid var(--line);
    background:var(--bg);
    color:var(--text);
    text-align:center;
  }

  .family-preview-button:hover,
  .family-preview-button:focus-visible,
  .enter-button:hover,
  .enter-button:focus-visible,
  .back-button:hover,
  .back-button:focus-visible,
  .icon-card:hover,
  .icon-card:focus-visible,
  .icon-card[aria-pressed="true"]{
    border-color:var(--accent);
    outline:2px solid var(--accent);
    outline-offset:2px;
  }

  .family-preview-button canvas{
    width:84px;
    height:84px;
    margin:auto;
    display:block;
  }

  .preview-hint{
    color:var(--muted);
    font-size:.9rem;
  }

  .family-card-title{
    margin:0;
    font-size:1.05rem;
  }

  .family-card-desc{
    margin:0;
    color:var(--muted);
    line-height:1.7;
    font-size:.95rem;
  }

  .enter-button,
  .back-button,
  .reset{
    min-height:44px;
    border:1px solid var(--accent);
    background:var(--accent);
    color:#fff;
  }

  .back-button{
    background:transparent;
    color:var(--accent);
  }

  .breadcrumb{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    align-items:center;
    margin-bottom:18px;
    color:var(--muted);
  }

  .family-layout{
    display:grid;
    grid-template-columns:minmax(0,320px) minmax(0,1fr);
    gap:18px;
    align-items:start;
  }

  .icon-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:12px;
  }

  .icon-card{
    display:grid;
    gap:10px;
    justify-items:center;
    padding:14px 12px;
    color:var(--text);
    background:var(--surface);
    border:1px solid var(--line);
  }

  .icon-card canvas{
    width:84px;
    height:84px;
    display:block;
  }

  .icon-label{
    text-align:center;
    font-size:.95rem;
  }

  .preview-panel,
  .control-panel{
    padding:18px;
  }

  .checker{
    display:grid;
    place-items:center;
    min-height:330px;
    background:
      linear-gradient(45deg,#ececec 25%,transparent 25%),
      linear-gradient(-45deg,#ececec 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,#ececec 75%),
      linear-gradient(-45deg,transparent 75%,#ececec 75%);
    background-size:22px 22px;
    background-position:0 0,0 11px,11px -11px,-11px 0;
  }

  #preview{
    width:min(280px,70vw);
    height:auto;
    display:block;
  }

  .controls{
    display:grid;
    gap:14px;
  }

  .control{
    display:grid;
    gap:6px;
  }

  .control-line{
    display:flex;
    justify-content:space-between;
    gap:10px;
    color:var(--muted);
  }

  input[type="range"]{width:100%}

  input[type="color"]{
    width:100%;
    height:44px;
    padding:3px;
    border:1px solid var(--line);
    background:#fff;
  }

  pre{
    margin:18px 0 0;
    padding:14px;
    overflow:auto;
    border:1px solid var(--line);
    background:var(--bg);
    line-height:1.55;
  }

  .footnote{
    margin-top:18px;
    color:var(--muted);
    font-size:.92rem;
    line-height:1.7;
  }

  @media (max-width:860px){
    .family-layout{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<main>
  <h1>Canvas Icon Playground</h1>
  <p class="intro">
    家族首頁先看封面預覽。點小圖可切換下一顆 icon；進入家族後才顯示該家族全部 icon 與參數調整。
  </p>

  <section id="family-home" class="view">
    <div id="family-grid" class="family-grid"></div>
  </section>

  <section id="family-detail" class="view" hidden>
    <div class="breadcrumb">
      <button id="back-button" class="back-button" type="button">← 回全部家族</button>
      <span>></span>
      <span id="detail-family-name"></span>
    </div>

    <div class="family-layout">
      <div>
        <div class="preview-panel">
          <h2 id="selected-title">預覽</h2>
          <div class="checker">
            <canvas id="preview" width="320" height="320"></canvas>
          </div>

          <pre id="call-output"></pre>

          <p class="footnote">
            要匯出 PNG 時，將這個 Canvas 再交給軍火庫既有的 Canvas PNG / PNG Download 零件即可。
            Icon 家族本身不綁匯出功能。
          </p>
        </div>

        <div class="control-panel" style="margin-top:18px;">
          <h2>視覺參數</h2>
          <div id="controls" class="controls"></div>
          <button id="reset" class="reset" type="button">恢復這顆 icon 的預設值</button>
        </div>
      </div>

      <div>
        <h2 id="detail-family-title"></h2>
        <p id="detail-family-desc" class="intro"></p>
        <div id="icon-grid" class="icon-grid"></div>
      </div>
    </div>
  </section>
</main>

<script src="./core.js"></script>
<script src="./arrows.js"></script>
<script src="./playback.js"></script>
<script>
(() => {
  "use strict";

  const api = window.SlowlyCanvasIcons;
  const familyHome = document.getElementById("family-home");
  const familyDetail = document.getElementById("family-detail");
  const familyGrid = document.getElementById("family-grid");
  const detailFamilyName = document.getElementById("detail-family-name");
  const detailFamilyTitle = document.getElementById("detail-family-title");
  const detailFamilyDesc = document.getElementById("detail-family-desc");
  const iconGrid = document.getElementById("icon-grid");
  const controlsEl = document.getElementById("controls");
  const preview = document.getElementById("preview");
  const selectedTitle = document.getElementById("selected-title");
  const callOutput = document.getElementById("call-output");
  const resetButton = document.getElementById("reset");
  const backButton = document.getElementById("back-button");

  const familyPreviewState = new Map();
  let selectedFamily = null;
  let selectedIcon = null;
  let values = {};

  function safeNumber(value, fallback) {
    const number = Number(value);
    return Number.isFinite(number) ? number : fallback;
  }

  function getFamilies() {
    return api.listFamilies();
  }

  function getFamilyMeta(name) {
    return getFamilies().find((family) => family.name === name) || null;
  }

  function getPreviewIcons(familyMeta) {
    const known = new Set(api.listIcons(familyMeta.name).map((icon) => icon.name));
    const ordered = (familyMeta.previewOrder || []).filter((name) => known.has(name));
    const rest = api.listIcons(familyMeta.name).map((icon) => icon.name).filter((name) => !ordered.includes(name));
    return ordered.concat(rest);
  }

  function getCurrentPreviewIcon(familyMeta) {
    const list = getPreviewIcons(familyMeta);
    if (!list.length) return null;
    const index = familyPreviewState.get(familyMeta.name) || 0;
    return list[index % list.length];
  }

  function cyclePreviewIcon(familyMeta) {
    const list = getPreviewIcons(familyMeta);
    if (!list.length) return;
    const current = familyPreviewState.get(familyMeta.name) || 0;
    familyPreviewState.set(familyMeta.name, (current + 1) % list.length);
  }

  function showHome() {
    familyHome.hidden = false;
    familyDetail.hidden = true;
  }

  function showDetail() {
    familyHome.hidden = true;
    familyDetail.hidden = false;
  }

  function renderFamilyHome() {
    familyGrid.replaceChildren();

    getFamilies().forEach((familyMeta) => {
      const card = document.createElement("article");
      card.className = "family-card";

      const previewButton = document.createElement("button");
      previewButton.type = "button";
      previewButton.className = "family-preview-button";
      previewButton.title = "點圖切換下一個預覽";

      const canvas = document.createElement("canvas");
      canvas.width = 128;
      canvas.height = 128;
      const currentIconName = getCurrentPreviewIcon(familyMeta);
      if (currentIconName) {
        const defaults = api.getDefaults(familyMeta.name, currentIconName);
        api.draw(familyMeta.name, currentIconName, canvas, {
          ...defaults,
          size: 92,
          thickness: Math.min(Number(defaults.thickness) || 18, 20),
          padding: 4
        });
      }

      const hint = document.createElement("span");
      hint.className = "preview-hint";
      hint.textContent = currentIconName ? `預覽：${currentIconName}（點圖切換）` : "點圖切換預覽";

      previewButton.append(canvas, hint);
      previewButton.addEventListener("click", () => {
        cyclePreviewIcon(familyMeta);
        renderFamilyHome();
      });

      const title = document.createElement("h2");
      title.className = "family-card-title";
      title.textContent = familyMeta.label;

      const desc = document.createElement("p");
      desc.className = "family-card-desc";
      desc.textContent = familyMeta.desc || "";

      const enter = document.createElement("button");
      enter.type = "button";
      enter.className = "enter-button";
      enter.textContent = `進入 ${familyMeta.label}`;
      enter.addEventListener("click", () => {
        selectedFamily = familyMeta.name;
        const previewIcon = getCurrentPreviewIcon(familyMeta);
        const allIcons = api.listIcons(familyMeta.name);
        selectedIcon = previewIcon || allIcons[0]?.name || null;
        resetValues();
        renderFamilyDetail();
        showDetail();
      });

      card.append(previewButton, title, desc, enter);
      familyGrid.appendChild(card);
    });
  }

  function resetValues() {
    if (!selectedFamily || !selectedIcon) return;
    values = api.getDefaults(selectedFamily, selectedIcon);
    renderControls();
    renderPreview();
  }

  function renderControls() {
    controlsEl.replaceChildren();
    if (!selectedFamily) return;

    const family = api.getFamily(selectedFamily);

    family.controls.forEach((control) => {
      const wrapper = document.createElement("label");
      wrapper.className = "control";

      const line = document.createElement("span");
      line.className = "control-line";

      const title = document.createElement("span");
      title.textContent = control.label || control.key;

      const current = document.createElement("strong");
      current.textContent = String(values[control.key]);

      line.append(title, current);

      const input = document.createElement("input");
      input.type = control.type || "range";
      input.value = String(values[control.key]);
      if (control.min !== undefined) input.min = String(control.min);
      if (control.max !== undefined) input.max = String(control.max);
      if (control.step !== undefined) input.step = String(control.step);

      input.addEventListener("input", () => {
        if (input.type === "color") {
          values[control.key] = input.value;
        } else {
          values[control.key] = safeNumber(input.value, values[control.key]);
        }
        current.textContent = String(values[control.key]);
        renderPreview();
      });

      wrapper.append(line, input);
      controlsEl.appendChild(wrapper);
    });
  }

  function renderPreview() {
    if (!selectedFamily || !selectedIcon) return;
    const iconMeta = api.listIcons(selectedFamily).find((icon) => icon.name === selectedIcon);
    const familyMeta = getFamilyMeta(selectedFamily);

    selectedTitle.textContent = `${familyMeta?.label || selectedFamily} · ${iconMeta?.label || selectedIcon}`;
    api.draw(selectedFamily, selectedIcon, preview, values);

    const hostOptions = { ...values };
    delete hostOptions.clear;

    callOutput.textContent =
`SlowlyCanvasIcons.draw(\n  "${selectedFamily}",\n  "${selectedIcon}",\n  canvas,\n  ${JSON.stringify(hostOptions, null, 2)}\n);`;
  }

  function renderFamilyDetail() {
    if (!selectedFamily) return;

    const familyMeta = getFamilyMeta(selectedFamily);
    detailFamilyName.textContent = familyMeta?.label || selectedFamily;
    detailFamilyTitle.textContent = familyMeta?.label || selectedFamily;
    detailFamilyDesc.textContent = familyMeta?.desc || "";

    iconGrid.replaceChildren();

    api.listIcons(selectedFamily).forEach((iconMeta) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "icon-card";
      button.setAttribute("aria-pressed", iconMeta.name === selectedIcon ? "true" : "false");

      const canvas = document.createElement("canvas");
      canvas.width = 128;
      canvas.height = 128;
      const defaults = api.getDefaults(selectedFamily, iconMeta.name);
      api.draw(selectedFamily, iconMeta.name, canvas, {
        ...defaults,
        size: 92,
        thickness: Math.min(Number(defaults.thickness) || 18, 20),
        padding: 4
      });

      const label = document.createElement("span");
      label.className = "icon-label";
      label.textContent = iconMeta.label;

      button.append(canvas, label);
      button.addEventListener("click", () => {
        selectedIcon = iconMeta.name;
        resetValues();
        renderFamilyDetail();
      });
      iconGrid.appendChild(button);
    });

    renderControls();
    renderPreview();
  }

  backButton.addEventListener("click", () => {
    showHome();
  });

  resetButton.addEventListener("click", resetValues);

  renderFamilyHome();
  showHome();
})();
</script>
</body>
</html>
