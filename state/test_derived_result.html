<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Derived Result 功能測試</title>
<style>
body{
  font-family:Arial,"Microsoft JhengHei",sans-serif;
  margin:32px;
  line-height:1.7;
  color:#263029;
}
.test{
  max-width:760px;
  padding:14px 16px;
  margin:12px 0;
  border:1px solid #d6ddd1;
  border-radius:10px;
}
.pass{background:#edf8ef}
.fail{background:#fff0f0}
code{background:#f5f5f5;padding:2px 5px}
</style>
</head>
<body>
<h1>Derived Result 功能測試</h1>
<p>
  模擬「輸入 → 產生預覽 → 修改輸入 → 預覽過期 → 重新產生」。
  不依賴 Storage、QRCode 或 DOM renderer。
</p>

<div id="results"></div>

<script src="./derived_result.js"></script>
<script>
(function(){
  "use strict";

  var root = document.getElementById("results");

  function check(name, actual, expected){
    var pass = actual === expected;
    var box = document.createElement("div");

    box.className = "test " + (pass ? "pass" : "fail");
    box.innerHTML =
      "<strong>" + (pass ? "PASS" : "FAIL") + "｜" + name + "</strong><br>" +
      "actual: <code>" + String(actual) + "</code><br>" +
      "expected: <code>" + String(expected) + "</code>";

    root.appendChild(box);
  }

  var preview = DerivedResult.create();

  check("初始沒有結果", preview.status(), "empty");
  check("初始 fresh = false", preview.isFresh(), false);

  preview.commit({ payload: "A" });

  check("產生後為 fresh", preview.status(), "fresh");
  check(
    "產生後保存結果",
    preview.snapshot().value.payload,
    "A"
  );

  preview.touch();

  check("輸入改變後為 stale", preview.status(), "stale");
  check("stale 不等於 empty", preview.snapshot().hasResult, true);

  preview.commit({ payload: "B" });

  check("重新產生後恢復 fresh", preview.status(), "fresh");
  check(
    "重新產生使用新結果",
    preview.snapshot().value.payload,
    "B"
  );

  preview.touch();
  preview.touch();

  check(
    "多次修改會累加來源版本",
    preview.snapshot().sourceRevision,
    3
  );

  preview.clear();

  check("clear 後為 empty", preview.status(), "empty");
  check(
    "clear 不倒退來源版本",
    preview.snapshot().sourceRevision,
    3
  );
})();
</script>
</body>
</html>
