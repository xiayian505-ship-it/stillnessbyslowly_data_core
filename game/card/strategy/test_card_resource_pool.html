  <style>
    :root { font-family: system-ui, sans-serif; color-scheme: light; }
    body { max-width: 980px; margin: 24px auto; padding: 0 18px 40px; line-height: 1.65; }
    h1 { line-height: 1.25; }
    nav a { margin-right: 18px; }
    section { margin: 30px 0; }
    code, pre { font-family: ui-monospace, Consolas, monospace; }
    pre { padding: 14px; border: 1px solid #d7d7d7; background: #f7f7f7; white-space: pre; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }

<body>
  <nav><a href="card_resource_pool_usage.html">使用說明</a> <a href="card_resource_pool_demo.html">Demo 展示</a> <a href="test_card_resource_pool.html">功能測試</a></nav>
  <h1>多資源池｜功能測試</h1>
  <p>保存宿主自訂名稱的資源，檢查多種資源是否足夠，並在足額時一次扣除。</p>

  <section>
    <h2>獨立測試結果</h2>
    <p>下列斷言使用目前頁面引入的實際零件執行，而不是預先寫好的 PASS 字樣。</p>
    <pre id="testResults" aria-live="polite"></pre>
  </section>
  
  <script src="./card_resource_pool.js"></script>
  <script>
    const testLines = [];
    let failureCount = 0;

    function verify(description, condition) {
      const passed = Boolean(condition);
      if (!passed) {
        failureCount += 1;
      }
      testLines.push((passed ? "PASS  " : "FAIL  ") + description);
    }

    function throwsError(callback) {
      try {
        callback();
        return false;
      } catch (error) {
        return true;
      }
    }

    try {
      const resourcePool = CardResourcePool.createPool({ movement: 3, crystals: 1 });
      verify("初始數值正確", resourcePool.getAmount("movement") === 3);
      verify("多資源不足拒絕付款", resourcePool.spend({ movement: 2, crystals: 2 }) === false);
      verify("不足時所有數值不變", resourcePool.getAmount("movement") === 3 && resourcePool.getAmount("crystals") === 1);
      verify("足額才整筆扣除", resourcePool.spend({ movement: 2, crystals: 1 }) && resourcePool.getAmount("movement") === 1);
      const snapshot = resourcePool.getSnapshot();
      resourcePool.addAmount("movement", 10);
      resourcePool.restoreSnapshot(snapshot);
      verify("快照還原正常", resourcePool.getAmount("movement") === 1);
    } catch (error) {
      failureCount += 1;
      testLines.push("FAIL  測試執行錯誤：" + error.message);
    }

    testLines.push("");
    testLines.push(failureCount === 0 ? "ALL PASS" : failureCount + " FAILED");
    const resultElement = document.getElementById("testResults");
    resultElement.textContent = testLines.join("\n");
    resultElement.className = failureCount === 0 ? "pass" : "fail";
  </script>
</body>
</html>
