<h1>Next Sequence</h1>
<p>只負責從既有資料算出下一個序號。是否保存 counter、如何格式化，以及序號是否回收都由宿主決定。</p>
<pre><code>&lt;script src="next_sequence.js"&gt;&lt;/script&gt;
&lt;script&gt;
const nextNumber = NextSequence.next(
  records,
  {
    prefix: "Z",
    getValue: record => record.seqId
  }
);

const seqId = `Z${nextNumber}`;
&lt;/script&gt;</code></pre>
