<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fiction Sort 功能測試</title>
  <style>
    :root {
      --bg: #f4f5f5;
      --surface: #ffffff;
      --text: #202426;
      --muted: #687176;
      --line: #d9dddf;
      --accent: #536d78;
      --content: 860px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, "Microsoft JhengHei", sans-serif;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    main {
      width: min(calc(100% - 32px), var(--content));
      margin: 0 auto;
      padding: 64px 0;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 2rem;
    }

    .intro {
      margin: 0 0 32px;
      color: var(--muted);
      line-height: 1.8;
    }

    .status {
      margin-bottom: 20px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      background: var(--surface);
      line-height: 1.7;
    }

    .grid {
      display: grid;
      gap: 14px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .card {
      padding: 18px;
      border: 1px solid var(--line);
      background: var(--surface);
    }

    .card h2 {
      margin: 0 0 12px;
      font-size: 1.05rem;
    }

    .desc {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.6;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button {
      padding: 8px 12px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
    }

    button:hover { border-color: var(--accent); }

    pre {
      margin: 20px 0 0;
      padding: 18px;
      min-height: 220px;
      overflow: auto;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .back {
      display: inline-block;
      margin-top: 18px;
      color: var(--accent);
      text-decoration: none;
    }

    .back:hover { text-decoration: underline; }

    @media (max-width: 680px) {
      main {
        width: min(calc(100% - 24px), var(--content));
        padding: 40px 0;
      }

      h1 { font-size: 1.7rem; }

      .grid { grid-template-columns: 1fr; }

      .card { padding: 16px; }

      pre {
        min-height: 180px;
        padding: 14px;
      }
    }
</style>
</head>
<body>
  <main>
    <h1>Fiction Sort 功能測試</h1>
    <p class="intro">測試 Fiction_sort.js 的數字、日期、字串、自動判定與自訂 compare。</p>
    <div class="status" id="status">模組檢查中...</div>
    <div class="grid">
      <section class="card">
        <h2>Sort</h2>
        <p class="desc">確認不同型別與方向的排序結果。</p>
        <div class="actions">
          <button id="number">score 高到低</button>
          <button id="date">日期新到舊</button>
          <button id="string">標題字串排序</button>
          <button id="auto">auto 排 score</button>
          <button id="custom">自訂標題長度</button>
        </div>
      </section>
    </div>
    <pre id="output">等待操作...</pre>
    <a class="back" href="../">返回慢慢的倉庫</a>
  </main>
  <script src="./Fiction_sort.js"></script>
  <script>
    const statusEl = document.getElementById("status");
    const output = document.getElementById("output");
    const items = [
      { title: "白塔", score: 10, createdAt: "2026-09-01T00:00:00.000Z" },
      { title: "月下旅人", score: 30, createdAt: "2026-09-03T00:00:00.000Z" },
      { title: "海邊書店", score: 20, createdAt: "2026-09-02T00:00:00.000Z" }
    ];

    function show(title, data) {
      output.textContent = title + "\n\n" + JSON.stringify(data, null, 2);
    }

    if (typeof FictionSort === "undefined") {
      statusEl.textContent = "載入失敗：找不到 FictionSort";
      throw new Error("FictionSort 未載入");
    }

    statusEl.textContent = "載入成功：FictionSort v" + FictionSort.version;

    document.getElementById("number").onclick = () =>
      show("score 高到低", FictionSort.sort(items, { field: "score", direction: "desc", type: "number" }));

    document.getElementById("date").onclick = () =>
      show("日期新到舊", FictionSort.sort(items, { field: "createdAt", direction: "desc", type: "date" }));

    document.getElementById("string").onclick = () =>
      show("標題字串排序", FictionSort.sort(items, { field: "title", direction: "asc", type: "string" }));

    document.getElementById("auto").onclick = () =>
      show("auto 排 score", FictionSort.sort(items, { field: "score", direction: "asc" }));

    document.getElementById("custom").onclick = () =>
      show("自訂標題長度", FictionSort.sort(items, { compare: (a, b) => a.title.length - b.title.length }));
  </script>
</body>
</html>
