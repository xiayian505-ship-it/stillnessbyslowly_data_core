<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slowly Data CRUD Component Demo</title>

  <link rel="stylesheet" href="./data_crud_component.css">

  <style>
    body{
      margin:0;
      padding:24px;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    }

    main{
      width:min(1000px,100%);
      margin:0 auto;
    }

    h1{
      margin:0 0 6px;
      font-size:1.5rem;
    }

    .demo-note{
      margin:0 0 24px;
      color:#777;
    }

    .change-log{
      margin-top:24px;
      padding:16px;
      border:1px solid #ddd;
      white-space:pre-wrap;
      overflow-wrap:anywhere;
      font-family:Consolas,Monaco,monospace;
      font-size:14px;
      line-height:1.6;
    }
  </style>
</head>

<body>
  <main>
    <h1>Slowly Data CRUD Component</h1>
    <p class="demo-note">
      查看、新增、修改、刪除。資料儲存在 localStorage，資料變更後會發送 Change 事件。
    </p>

    <div id="crud-demo"></div>

    <div id="change-log" class="change-log">
等待資料變更...
    </div>
  </main>

  <!--
    載入順序：
    1. Timestamp
    2. FictionStorage
    3. FictionChange
    4. Data CRUD Component
  -->
  <script src="https://lib.stillnessbyslowly.com/date/timestamp.js"></script>
  <script src="https://lib.stillnessbyslowly.com/fiction/Fiction_storage.js"></script>
  <script src="https://lib.stillnessbyslowly.com/fiction/Fiction_change.js"></script>
  <script src="./data_crud_component.js"></script>

  <script>
    const changeLog = document.getElementById("change-log");

    const crud = SlowlyDataCRUD.create({
      // 必填：selector 或 HTMLElement。
      target: "#crud-demo",

      // 必填：每個宿主工具請使用自己的唯一 storageKey。
      storageKey: "slowly-data-crud-demo",

      // 可省略。宿主可自行修改文字。
      title: "範例資料",

      fields: [
        {
          key: "name",
          label: "名稱",
          type: "text",
          required: true,
          placeholder: "請輸入名稱"
        },
        {
          key: "amount",
          label: "金額",
          type: "number"
        },
        {
          key: "date",
          label: "日期",
          type: "date"
        },
        {
          key: "status",
          label: "狀態",
          type: "select",

          // select 可直接使用字串陣列：
          // options: ["進行中", "已完成"]

          // 或使用 value / label：
          options: [
            { value: "active", label: "進行中" },
            { value: "done", label: "已完成" }
          ],

          defaultValue: "active"
        },
        {
          key: "important",
          label: "重要",
          type: "checkbox",
          defaultValue: false
        },
        {
          key: "note",
          label: "備註",
          type: "textarea",

          // false = 不顯示在列表摘要，但查看與編輯仍保留。
          list: false
        }
      ],

      // 可選：資料新增、修改、刪除後接收 Change 事件。
      onChange(event) {
        changeLog.textContent =
          JSON.stringify(event, null, 2);
      }
    });

    // 也可以另外使用 subscribe() 訂閱。
    //
    // const unsubscribe = crud.subscribe(event => {
    //   console.log(event);
    // });
    //
    // unsubscribe();
  </script>
</body>
</html>
