<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pushable Object｜一步推動方案｜Demo</title>
<style>
  .grid { display: grid; grid-template-columns: repeat(var(--columns, 5), minmax(32px, 42px)); gap: 3px; margin: 12px 0; }
  .cell { min-height: 37px; touch-action: manipulation; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 10px 0; }
  canvas { border: 1px solid; max-width: 100%; }
  output, pre { display: block; white-space: pre-wrap; margin: 10px 0; }
  button { padding: 5px; }
</style>
</head>
<body>
<h1>Pushable Object｜一步推動方案</h1>
<p>本頁直接呼叫軍火庫零件；只提供辨識與操作必要的尺寸／排列。</p>

<div class="row"><button data-direction="up">↑</button><button data-direction="left">←</button><button data-direction="right">→</button><button data-direction="down">↓</button><button id="reset">重設</button></div>
<div id="board" class="grid" style="--columns:5"></div>
<p>■ 是箱子，牆不會被推動。點方向鍵只會在方案允許時由宿主提交資料。</p>

<output id="result" aria-live="polite"></output>
<script src="https://lib.stillnessbyslowly.com/game/grid/grid_occupancy.js"></script>
<script src="https://lib.stillnessbyslowly.com/game/grid/pushable_object.js"></script>
<script>
(function () {
  "use strict";
  const result_element = document.getElementById("result");
  function show(value) {
    result_element.textContent = typeof value === "string" ? value : JSON.stringify(value, null, 2);
  }
  function report_error(error) {
    show("操作失敗：" + error.message);
    console.error(error);
  }

  const walls=new Set(['2:4','0:2']);
  const boxes=new Set();
  const board=document.getElementById('board');
  const map={up:{r:-1,c:0},down:{r:1,c:0},left:{r:0,c:-1},right:{r:0,c:1}};
  let current={r:2,c:2};
  function key(position){return `${position.r}:${position.c}`;}
  const occupancy_options={rows:5,columns:5,is_blocked:p=>walls.has(key(p)),is_occupied:p=>boxes.has(key(p))};
  function draw(){
    board.replaceChildren();
    for(let row=0;row<5;row++)for(let column=0;column<5;column++){
      const cell={r:row,c:column};
      const element=document.createElement('button');
      element.disabled=true;element.className='cell';
      element.textContent=walls.has(key(cell))?'牆':boxes.has(key(cell))?'■':'·';
      board.append(element);
    }
  }
  function reset(){boxes.clear();current={r:2,c:2};boxes.add(key(current));draw();show('箱子在 (2,2)，可用四向鍵推動。');}
  document.querySelectorAll('[data-direction]').forEach(button=>button.addEventListener('click',()=>{
    try{
      const proposal=SlowlyPushableObject.plan_push({position:current,direction:map[button.dataset.direction],occupancy_options});
      if(proposal.allowed){boxes.delete(key(proposal.from));boxes.add(key(proposal.to));current=proposal.to;}
      draw();show(proposal);
    }catch(error){report_error(error);}
  }));
  document.getElementById('reset').addEventListener('click',reset);reset();

})();
</script>
</body>
</html>
