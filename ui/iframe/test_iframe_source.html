<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Iframe Source｜功能測試</title>
  <style>
    body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:900px;margin:40px auto;padding:0 20px;line-height:1.6}
    .controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
    button{padding:8px 12px}
    iframe{width:100%;min-height:240px;border:1px solid #ccc}
    pre{background:#f5f5f5;padding:12px;white-space:pre-wrap}
  </style>
</head>
<body>
  <h1>Iframe Source｜功能測試</h1>

  <div class="controls">
    <button id="setA">設定 example.com</button>
    <button id="setBlank">設定 about:blank</button>
    <button id="read">讀取 src</button>
    <button id="clear">清除 src</button>
  </div>

  <iframe id="viewer" title="Iframe Source 測試"></iframe>
  <pre id="log">等待操作</pre>

  <script src="./iframe_source.js"></script>
  <script>
    const log = document.getElementById("log");

    document.getElementById("setA").addEventListener("click", () => {
      SlowlyIframeSource.set("#viewer", "https://example.com/");
      log.textContent = "已設定：https://example.com/";
    });

    document.getElementById("setBlank").addEventListener("click", () => {
      SlowlyIframeSource.set("#viewer", "about:blank");
      log.textContent = "已設定：about:blank";
    });

    document.getElementById("read").addEventListener("click", () => {
      log.textContent = "目前 src：" + SlowlyIframeSource.get("#viewer");
    });

    document.getElementById("clear").addEventListener("click", () => {
      SlowlyIframeSource.clear("#viewer");
      log.textContent = "已清除 src";
    });
  </script>
</body>
</html>
