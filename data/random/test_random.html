<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>SlowlyRandom Test</title>
</head>
<body>
  <pre id="result">測試中…</pre>
  <script src="./random.js"></script>
  <script>
    const errors = [];

    for (let i = 0; i < 500; i += 1) {
      const value = SlowlyRandom.int(1, 3);
      if (value < 1 || value > 3 || !Number.isInteger(value)) {
        errors.push(`int 超出範圍：${value}`);
        break;
      }
    }

    for (let i = 0; i < 500; i += 1) {
      const value = SlowlyRandom.float(-2, 5);
      if (value < -2 || value >= 5) {
        errors.push(`float 超出範圍：${value}`);
        break;
      }
    }

    if (SlowlyRandom.chance(0) !== false) {
      errors.push("chance(0) 應固定為 false");
    }

    if (SlowlyRandom.chance(1) !== true) {
      errors.push("chance(1) 應固定為 true");
    }

    document.getElementById("result").textContent =
      errors.length > 0
        ? `FAIL\n${errors.join("\n")}`
        : "PASS";
  </script>
</body>
</html>
