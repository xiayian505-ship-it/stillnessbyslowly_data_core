<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tooltip 操作示範</title>
<link rel="stylesheet" href="https://lib.stillnessbyslowly.com/ui/tooltip/tooltip.css">
<style>
body { font-family: system-ui, sans-serif; max-width: 900px; margin: 1.5rem auto; padding: 0 1rem; line-height: 1.65; }
button,input,select { font: inherit; padding: .35rem .6rem; margin: .15rem; min-height: 42px; }
pre,code { overflow-wrap: anywhere; white-space: pre-wrap; }
pre,fieldset { border: 1px solid #aaa; padding: .7rem; }
.row { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; }
#results > li { margin: .15rem 0; }
.ok { color: #17622f; } .fail { color: #a01418; }
</style>
</head><body>
<h1>Tooltip 操作示範</h1>
<p>滑鼠移上去、鍵盤 focus 或手機輕點都能顯示簡短提示。</p>
<div class="row"><button id="a">左側說明</button><span class="slowly-tooltip" id="ta" hidden>這是左側提示。</span><button id="b">右側說明</button><span class="slowly-tooltip" id="tb" hidden>這是右側提示。</span><button id="c">底部說明</button><span class="slowly-tooltip" id="tc" hidden>這是底部提示。</span></div>
<button id="hide_all">全部關閉</button><output id="status"></output>
<style>.slowly-tooltip:not([hidden]) {background:Canvas; border:1px solid currentColor; padding:.4rem}</style>
<script src="https://lib.stillnessbyslowly.com/ui/tooltip/tooltip.js"></script>
<script>
const tips=[SlowlyTooltip.create({trigger:'#a',tooltip:'#ta',placement:'top',delay_ms:0}),SlowlyTooltip.create({trigger:'#b',tooltip:'#tb',placement:'bottom',delay_ms:0}),SlowlyTooltip.create({trigger:'#c',tooltip:'#tc',placement:'bottom',delay_ms:0})];
document.querySelector('#hide_all').onclick=()=>{tips.forEach(t=>t.hide());document.querySelector('#status').textContent='已隱藏';};
</script>
</body></html>
