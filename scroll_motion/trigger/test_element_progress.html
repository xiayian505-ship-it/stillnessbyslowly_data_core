<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Element Progress | 慢慢軍火庫測試</title><style>body{margin:0;color:#243047;font-family:system-ui,"Microsoft JhengHei",sans-serif;line-height:1.7;background:#f0f4f9;} main{max-width:960px;margin:auto;padding:32px 20px;}h1{font-size:clamp(1.5rem,4vw,2.25rem);line-height:1.2}code{font-size:.9em} .intro{min-height:82vh;padding:30px;box-sizing:border-box;background:linear-gradient(150deg,#fff,#dceafe)}.card{width:min(360px,82vw);box-sizing:border-box;padding:24px;border-radius:18px;background:#fff;box-shadow:0 10px 26px #0c345226;font-weight:700;font-size:1.4rem;text-align:center}.spacer{height:95vh}.end{min-height:70vh;background:#dceafe;padding:40px 24px}.tag{background:#e8efff;padding:3px 7px;border-radius:5px}
</style></head><body><div class="intro"><main><h1>Trigger / Element Progress</h1><p>移動到下面的區域，進度應由 0 → 1，往回可反向。</p></main></div><section id="watch" style="height:180vh;padding:24px;background:#dceafe"><div class="card" style="position:sticky;top:40vh">進度：<span id="value">0</span></div></section><div class="end">結束</div><script src="./element_progress.js"></script><script>SlowlyScrollElementProgress.attach('#watch',{onUpdate(value){document.querySelector('#value').textContent=(value*100).toFixed(0)+'%';}});</script></body></html>
