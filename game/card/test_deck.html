<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deck 功能測試</title>
</head>
<body>
  <h1>Deck 功能測試</h1>
  <pre id="result"></pre>

  <script src="./deck.js"></script>
  <script>
    const lines = [];
    let failed = 0;

    function test(name, condition) {
      const pass = Boolean(condition);
      if (!pass) failed += 1;
      lines.push(`${pass ? "PASS" : "FAIL"}  ${name}`);
    }

    function sameArray(actual, expected) {
      return JSON.stringify(actual) === JSON.stringify(expected);
    }

    test("版本為 1.1.0", Deck.version === "1.1.0");

    // 關閉洗牌，固定抽牌順序：C → B → A。
    const deck = Deck.create({
      items: ["A", "B", "C"],
      handSize: 2,
      shuffleOnReset: false,
      shuffleOnRecycle: false
    });

    test("建立後 drawPile 有 3 個項目", deck.snapshot().drawPile.length === 3);

    const firstDraw = deck.draw(1);
    test("draw(1) 會把項目移進 hand", firstDraw[0] === "C" && deck.snapshot().hand.length === 1);

    deck.drawToHand();
    test("drawToHand() 會補到 handSize", deck.snapshot().hand.length === 2);

    const discarded = deck.discardAt(0);
    test("discardAt() 會由 hand 移到 discardPile", discarded === "C" && deck.snapshot().discardPile[0] === "C");

    const saved = deck.snapshot();
    test("snapshot() 會保存 sourceItems", sameArray(saved.sourceItems, ["A", "B", "C"]));

    deck.drawToHand(3);
    deck.discardAll();
    deck.setHandSize(9);
    deck.reset(["X", "Y"]);

    deck.restore(saved);
    const restored = deck.snapshot();

    test("restore() 會還原 drawPile", sameArray(restored.drawPile, saved.drawPile));
    test("restore() 會還原 hand", sameArray(restored.hand, saved.hand));
    test("restore() 會還原 discardPile", sameArray(restored.discardPile, saved.discardPile));
    test("restore() 會還原 handSize", restored.handSize === saved.handSize);
    test("restore() 會還原 sourceItems", sameArray(restored.sourceItems, saved.sourceItems));

    deck.reset();
    test("restore() 後 reset() 仍使用存檔的 sourceItems", sameArray(deck.snapshot().drawPile, ["A", "B", "C"]));

    const legacyDeck = Deck.create({
      items: [1, 2, 3],
      handSize: 1,
      shuffleOnReset: false
    });

    legacyDeck.restore({
      drawPile: [7, 8],
      hand: [9],
      discardPile: [6],
      handSize: 3
    });

    test("restore() 可讀取沒有 sourceItems 的 1.0.0 型快照", sameArray(legacyDeck.snapshot().hand, [9]));
    legacyDeck.reset();
    test("舊版快照沒有 sourceItems 時保留目前實例原始項目", sameArray(legacyDeck.snapshot().drawPile, [1, 2, 3]));

    let invalidSnapshotThrows = false;
    try {
      deck.restore({ drawPile: [], hand: null, discardPile: [] });
    } catch (error) {
      invalidSnapshotThrows = error instanceof TypeError;
    }
    test("restore() 遇到無效快照會明確丟出 TypeError", invalidSnapshotThrows);

    const recycleDeck = Deck.create({
      items: ["A", "B", "C"],
      handSize: 2,
      shuffleOnReset: false,
      shuffleOnRecycle: false
    });

    recycleDeck.draw(1);
    recycleDeck.drawToHand();
    recycleDeck.discardAt(0);
    recycleDeck.drawToHand(3);
    test("drawPile 空時會自動回收 discardPile", recycleDeck.snapshot().hand.length === 3 && recycleDeck.snapshot().discardPile.length === 0);

    recycleDeck.discardAll();
    test("discardAll() 會清空 hand", recycleDeck.snapshot().hand.length === 0 && recycleDeck.snapshot().discardPile.length === 3);

    recycleDeck.reset([1, 2]);
    test("reset(items) 可替換宿主資料", recycleDeck.snapshot().drawPile.length === 2 && recycleDeck.snapshot().discardPile.length === 0);

    test("模組不依賴 Game", typeof window.Game === "undefined");

    lines.push("");
    lines.push(failed === 0 ? "ALL PASS" : `${failed} FAILED`);
    document.getElementById("result").textContent = lines.join("\n");
  </script>
</body>
</html>
