  <style>

<body>
  <nav><a href="card_effect_registry_usage.html">使用說明</a> <a href="card_effect_registry_demo.html">Demo 展示</a> <a href="test_card_effect_registry.html">功能測試</a></nav>
  <h1>卡牌效果登記器｜功能測試</h1>
  <p>儲存宿主登記的效果名稱、可執行條件與同步處理函式；依名稱檢查或執行。</p>

  <section>
    <h2>獨立測試結果</h2>
    <p>下列斷言使用目前頁面引入的實際零件執行，而不是預先寫好的 PASS 字樣。</p>
    <pre id="testResults" aria-live="polite"></pre>
  </section>
  
  <script src="./card_effect_registry.js"></script>
  <script>
    const testLines = [];
    let failureCount = 0;

    function verify(description, condition) {
      const passed = Boolean(condition);
      if (!passed) {
        failureCount += 1;
      }
      testLines.push((passed ? "PASS  " : "FAIL  ") + description);
    }

    function throwsError(callback) {
      try {
        callback();
        return false;
      } catch (error) {
        return true;
      }
    }

    try {
      const registry = CardEffectRegistry.createRegistry();
      registry.registerEffect("increase", { canRun: context => context.allowed, execute: context => context.score + 3 });
      verify("效果已登記", registry.hasEffect("increase"));
      verify("條件不符時拒絕", registry.executeEffect("increase", { allowed: false }).reason === "blocked");
      verify("條件通過後執行", registry.executeEffect("increase", { allowed: true, score: 2 }).value === 5);
      verify("未知效果不執行", registry.executeEffect("unknown", {}).reason === "unknown_effect");
      verify("可以列出登記名稱", registry.listEffectKeys()[0] === "increase");
    } catch (error) {
      failureCount += 1;
      testLines.push("FAIL  測試執行錯誤：" + error.message);
    }

    testLines.push("");
    testLines.push(failureCount === 0 ? "ALL PASS" : failureCount + " FAILED");
    const resultElement = document.getElementById("testResults");
    resultElement.textContent = testLines.join("\n");
    resultElement.className = failureCount === 0 ? "pass" : "fail";
  </script>
</body>
</html>
