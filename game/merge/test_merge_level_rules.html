<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Merge Level Rules｜獨立 PASS／FAIL 測試</title>
</head>
<body>
  <h1>Merge Level Rules｜實際功能測試</h1>
  <p>下方結果由瀏覽器逐項執行 JavaScript 斷言產生；失敗顯示 FAIL 與錯誤。</p>
  <p id="summary">測試執行中</p>
  <ol id="results"></ol>
  <script src="https://lib.stillnessbyslowly.com/game/merge/merge_level_rules.js"></script>
  <script>
    "use strict";

    const result_list = document.getElementById("results");
    let passed = 0;
    let failed = 0;

    function equal(actual, expected) {
      if (actual !== expected) {
        throw new Error("Expected " + JSON.stringify(expected) + ", got " + JSON.stringify(actual));
      }
    }

    function deep(actual, expected) {
      const actual_text = JSON.stringify(actual);
      const expected_text = JSON.stringify(expected);
      if (actual_text !== expected_text) {
        throw new Error("Expected " + expected_text + ", got " + actual_text);
      }
    }

    function check(condition, message = "condition is false") {
      if (!condition) throw new Error(message);
    }

    function throws(callback) {
      let threw = false;
      try { callback(); } catch (error) { threw = true; }
      check(threw, "Expected an exception.");
    }

    function test(title, assertion) {
      const row = document.createElement("li");
      try {
        assertion();
        passed += 1;
        row.textContent = "PASS — " + title;
      } catch (error) {
        failed += 1;
        row.textContent = "FAIL — " + title + ": " + error.message;
      }
      result_list.appendChild(row);
    }

    const inspect=SlowlyMergeLevelRules.inspect_merge;
test('同級升一級',()=>{const r=inspect({first_level:1,second_level:1,max_level:5});check(r.mergeable);equal(r.next_level,2);});
test('零級合法',()=>{equal(inspect({first_level:0,second_level:0,max_level:5}).next_level,1);});
test('空格 0 由宿主設定',()=>{equal(inspect({first_level:0,second_level:0,max_level:5,empty_level:0}).reason,'empty');});
test('不同級拒絕',()=>{equal(inspect({first_level:1,second_level:2,max_level:5}).reason,'different_levels');});
test('滿級拒絕',()=>{equal(inspect({first_level:5,second_level:5,max_level:5}).reason,'max_level');});
test('高於滿級也拒絕',()=>{check(!inspect({first_level:9,second_level:9,max_level:5}).mergeable);});
test('第一物件資格鎖定',()=>{equal(inspect({first_level:1,second_level:1,max_level:5,eligible_first:false}).reason,'ineligible');});
test('第二物件資格鎖定',()=>{equal(inspect({first_level:1,second_level:1,max_level:5,eligible_second:false}).reason,'ineligible');});
test('未設定等級視為空',()=>{equal(inspect({second_level:1,max_level:5}).reason,'empty');});
test('負級與小數被拒絕',()=>{throws(()=>inspect({first_level:-1,second_level:1,max_level:5}));throws(()=>inspect({first_level:1.1,second_level:1,max_level:5}));});
test('非法最高等級被拒絕',()=>{throws(()=>inspect({first_level:1,second_level:1,max_level:-1}));});
test('非布林資格拒絕',()=>{throws(()=>inspect({first_level:1,second_level:1,max_level:5,eligible_first:'false'}));});
test('沒有修改宿主物件',()=>{const v={first_level:1,second_level:1,max_level:5};const before=JSON.stringify(v);inspect(v);equal(JSON.stringify(v),before);});

    document.getElementById("summary").textContent = passed + " PASS / " + failed + " FAIL";
    window.__test_results = { passed, failed };
  </script>
</body>
</html>
