<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dialogue Sequence Test</title>
</head>
<body>
  <h1>Dialogue Sequence Test</h1>
  <p>以下為實際執行的獨立檢查；錯誤會顯示 FAIL，沒有固定假 PASS。</p>
  <pre id="test_results"></pre>
  <script src="https://lib.stillnessbyslowly.com/effects/typography/typewriter.js"></script>
  <script src="https://lib.stillnessbyslowly.com/state/dialogue_sequence.js"></script>
  <script>
    const test_results = document.querySelector('#test_results');
    let passes = 0;
    let failures = 0;
    const lines = [];
    function check(label, run) {
      try {
        if (run() !== true) throw new Error('檢查結果不符合預期');
        passes += 1;
        lines.push('PASS ' + label);
      } catch (error) {
        failures += 1;
        lines.push('FAIL ' + label + '：' + error.message);
      }
    }
    function approx(first, second, tolerance = 0.000001) {
      return Math.abs(first - second) <= tolerance;
    }
    function throws(run) {
      try { run(); return false; } catch (error) { return true; }
    }

    const events = [];
    const dialogue = SlowlyDialogueSequence.create({
      on_line_start(line, index) { events.push('start' + index); },
      on_line_complete(line, index) { events.push('complete' + index); },
      on_finished() { events.push('finished'); }
    });
    check('空序列立刻完成', () => dialogue.start([]).finished);
    check('開始第一句', () => dialogue.start([{text:'第一'}, {text:'第二'}]).index === 0);
    check('新句尚未補全', () => !dialogue.snapshot().revealed);
    check('第一次推進只補全', () => { dialogue.advance(); return dialogue.snapshot().index === 0 && dialogue.snapshot().revealed; });
    check('第二次推進換句', () => { dialogue.advance(); return dialogue.snapshot().index === 1 && !dialogue.snapshot().revealed; });
    check('主動補全', () => dialogue.complete_current().revealed);
    check('最後一句後完成', () => dialogue.advance().finished);
    check('事件順序', () => events.join(',').includes('start0,complete0,start1,complete1,finished'));
    check('完成後重複推進安全', () => dialogue.advance().finished);
    check('重置保留資料', () => dialogue.reset().index === -1 && dialogue.start().index === 0);
    check('空字串視為已補全', () => dialogue.start([{text:''}]).revealed);
    check('禁止跳過生效', () => { const other = SlowlyDialogueSequence.create({allow_skip:false}); other.start([{text:'A'}]); const ok = !other.advance().revealed; other.complete_current(); other.destroy(); return ok; });
    check('多實例互不干擾', () => { const other = SlowlyDialogueSequence.create(); other.start([{text:'獨立'}]); const ok = dialogue.snapshot().line.text !== other.snapshot().line.text; other.destroy(); return ok; });
    check('拒絕無效句子', () => throws(() => dialogue.start([{speaker:'沒文字'}])));
    check('拒絕非陣列', () => throws(() => dialogue.start('錯誤')));
    check('銷毀後無法重開', () => { dialogue.destroy(); return throws(() => dialogue.start([{text:'一'}])); });

    lines.push('總計：' + passes + ' PASS / ' + failures + ' FAIL');
    test_results.textContent = lines.join('\n');
    document.body.dataset.test_status = failures === 0 ? 'PASS' : 'FAIL';
  </script>
</body>
</html>
