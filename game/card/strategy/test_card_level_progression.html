  <h1>卡牌等級處理｜功能測試</h1>
  <p>計算暫時等級增減後的有效等級；依宿主條件及上限升級選定卡牌。</p>

  <section>
    <h2>獨立測試結果</h2>
    <p>下列斷言使用目前頁面引入的實際零件執行，而不是預先寫好的 PASS 字樣。</p>
    <pre id="testResults" aria-live="polite"></pre>
  </section>
  
  <script src="./card_level_progression.js"></script>
  <script>
    const testLines = [];
    let failureCount = 0;

    function verify(description, condition) {
      const passed = Boolean(condition);
      if (!passed) {
        failureCount += 1;
      }
      testLines.push((passed ? "PASS  " : "FAIL  ") + description);
    }

    function throwsError(callback) {
      try {
        callback();
        return false;
      } catch (error) {
        return true;
      }
    }

    try {
      verify("等級加成依宿主上限截斷", CardLevelProgression.calculateEffectiveLevel(4, 3, { maximumLevel: 5 }) === 5);
      verify("負加成不會變成負等級", CardLevelProgression.calculateEffectiveLevel(1, -3) === 0);
      const cards = [{ level: 1, allowed: true }, { level: 3, allowed: false }];
      const changes = CardLevelProgression.upgradeEligibleCards(cards, { levelIncrease: 2, canUpgradeCard: card => card.allowed });
      verify("只有宿主允許的卡升級", cards[0].level === 3 && cards[1].level === 3);
      verify("只回報實際變更的卡", changes.length === 1 && changes[0].nextLevel === 3);
      verify("非法等級回報錯誤", throwsError(() => CardLevelProgression.calculateEffectiveLevel(-1)));
    } catch (error) {
      failureCount += 1;
      testLines.push("FAIL  測試執行錯誤：" + error.message);
    }

    testLines.push("");
    testLines.push(failureCount === 0 ? "ALL PASS" : failureCount + " FAILED");
    const resultElement = document.getElementById("testResults");
    resultElement.textContent = testLines.join("\n");
    resultElement.className = failureCount === 0 ? "pass" : "fail";
  </script>
</body>
