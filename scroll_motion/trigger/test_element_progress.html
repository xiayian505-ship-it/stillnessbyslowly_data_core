<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Element Progress | 慢慢軍火庫測試</title><style>body{margin:0}main{padding:16px}.intro{min-height:82vh;padding:16px;box-sizing:border-box}.card{display:inline-block;box-sizing:border-box;min-width:120px;padding:16px;border:1px solid currentColor;background:Canvas}.spacer{height:95vh}.end{min-height:65vh;padding:16px}
