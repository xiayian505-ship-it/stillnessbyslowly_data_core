<h1>Note Frequency</h1>
<p>把 C4、F#5、Bb3 等音名解析為 MIDI 與頻率；支援自訂 A4 基準頻率。</p>
<h2>最小使用</h2>
<pre><code>const info = SlowlyAudioNoteFrequency.parse("F#5");
const hz = SlowlyAudioNoteFrequency.toFrequency("F#5");

const custom = SlowlyAudioNoteFrequency.toFrequency("A4", {
  a4: 442
});</code></pre>
