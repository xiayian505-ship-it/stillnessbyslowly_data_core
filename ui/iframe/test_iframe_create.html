<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Iframe Create｜功能測試</title>
  <style>
    body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:900px;margin:40px auto;padding:0 20px;line-height:1.6}
    .controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
    button{padding:8px 12px}
    #host{padding:12px;border:1px dashed #aaa;min-height:120px}
    .created-frame{width:100%;min-height:180px;border:1px solid #ccc}
    pre{background:#f5f5f5;padding:12px;white-space:pre-wrap}
  </style>
</head>
<body>
  <h1>Iframe Create｜功能測試</h1>

  <div class="controls">
    <button id="create">建立 iframe</button>
    <button id="remove">移除 iframe</button>
  </div>

  <div id="host"></div>
  <pre id="log">等待操作</pre>

  <script src="./iframe_create.js"></script>
  <script>
    const host = document.getElementById("host");
    const log = document.getElementById("log");

    document.getElementById("create").addEventListener("click", () => {
      if (host.querySelector("iframe")) {
        log.textContent = "目前已經有 iframe";
        return;
      }

      const iframe = SlowlyIframeCreate.create({
        id: "viewer",
        className: "created-frame",
        title: "Iframe Create 測試"
      });

      host.appendChild(iframe);

      log.textContent =
        "tagName: " + iframe.tagName + "\n" +
        "id: " + iframe.id + "\n" +
        "className: " + iframe.className + "\n" +
        "title: " + iframe.title + "\n" +
        "src attribute: " + String(iframe.getAttribute("src"));
    });

    document.getElementById("remove").addEventListener("click", () => {
      host.querySelector("iframe")?.remove();
      log.textContent = "已移除 iframe";
    });
  </script>
</body>
</html>
