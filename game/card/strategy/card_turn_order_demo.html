  <style>
    :root { font-family: system-ui, sans-serif; color-scheme: light; }
    body { max-width: 980px; margin: 24px auto; padding: 0 18px 40px; line-height: 1.65; }
    h1 { line-height: 1.25; }
    nav a { margin-right: 18px; }

    table { width: 100%; border-collapse: collapse; }

<body>
  <nav><a href="card_turn_order_usage.html">使用說明</a> <a href="card_turn_order_demo.html">Demo 展示</a> <a href="test_card_turn_order.html">功能測試</a></nav>
  <h1>回合順序狀態｜Demo</h1>
  <p>保存參與者順序、目前輪到誰、整輪計數和宿主自訂的階段標記。</p>

  <section>
    <h2>可操作示範</h2>
    <p>以下資料與操作僅用於展示積木 API；不是《霧林之契》，也不是策略系卡牌完成品。</p>
    <div class="controls">
      <button type="button" data-action="advance">下一位</button>
      <button type="button" data-action="phase">切換階段</button>
      <button type="button" data-action="reset">重設順序</button>
    </div>
    <h3>目前結果</h3>
    <pre id="demoOutput" aria-live="polite"></pre>
  </section>
  
  <script src="./card_turn_order.js"></script>
  <script>
    const turnOrder = CardTurnOrder.createTurnOrder(
      ["participant-a", "participant-b", "participant-c"],
      { currentPhase: "planning" }
    );

    function runDemo(actionName) {
      if (actionName === "advance") {
        turnOrder.advanceTurn();
      }

      if (actionName === "phase") {
        const currentPhase = turnOrder.getSnapshot().currentPhase;
        turnOrder.setCurrentPhase(currentPhase === "planning" ? "action" : "planning");
      }

      if (actionName === "reset") {
        turnOrder.resetTurnOrder();
      }

      return turnOrder.getSnapshot();
    }

    const outputElement = document.getElementById("demoOutput");

    // Demo 的按鈕和狀態顯示都只屬於本頁，不包含在零件本身。
    function showDemoResult(actionName) {
      try {
        const demoResult = runDemo(actionName);
        outputElement.textContent = JSON.stringify(demoResult, null, 2);
      } catch (error) {
        outputElement.textContent = error.name + ": " + error.message;
      }
    }

    document.querySelectorAll("[data-action]").forEach(function (buttonElement) {
      buttonElement.addEventListener("click", function () {
        showDemoResult(buttonElement.dataset.action);
      });
    });

    showDemoResult("advance");
  </script>
</body>
</html>
