<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>慢 慢 | stillness by slowly 的軍火庫</title>
<link href="https://lib.stillnessbyslowly.com/ui/responsive.css" rel="stylesheet"/>
<link href="./index.css" rel="stylesheet"/>
</head>
<body>
<main>
  <nav class="breadcrumb" aria-label="階層導覽">
    <a href="./index.html">軍火庫</a>
    <span>›</span>
    <a id="category-link" href="./index.html">分類</a>
    <span>›</span>
    <span id="group-crumb">子分類</span>
  </nav>

  <header class="subpage-head">
    <h1 id="group-title">子分類</h1>
    <p id="group-desc" class="intro"></p>
    <p id="group-count" class="subpage-count"></p>
  </header>

  <div id="group-list" class="list"></div>
</main>

<script src="./index_data.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const pageName = params.get("page");
  const groupId = params.get("group");
  const targetCategory = params.get("category");
  const targetItem = params.get("item");
  const libraryData = window.SlowlyLibraryIndex || [];

  const page = libraryData.find((entry) => entry.page === pageName);
  const group = page?.groups?.find((entry) => entry.id === groupId);

  function createItem(item, index) {
    const card = document.createElement("div");
    card.className = "item";
    card.dataset.itemIndex = String(index);

    const title = document.createElement("div");
    title.className = "item-title";
    title.textContent = item.title;

    const desc = document.createElement("div");
    desc.className = "item-desc";
    desc.textContent = item.desc;

    const links = document.createElement("div");
    links.className = "item-links";
    (item.links || []).forEach((link) => {
      const a = document.createElement("a");
      a.href = link.href;
      a.textContent = link.label;
      links.appendChild(a);
    });

    card.append(title, desc, links);
    return card;
  }

  if (!page || !group) {
    document.getElementById("group-title").textContent = "找不到這個子分類";
    document.getElementById("group-desc").textContent = "請回到軍火庫首頁重新選擇。";
    document.getElementById("group-count").textContent = "";
  } else {
    document.title = `${group.title} | 慢 慢軍火庫`;
    const categoryLink = document.getElementById("category-link");
    categoryLink.textContent = page.title;
    categoryLink.href = `./index.html#${encodeURIComponent(page.page)}`;
    document.getElementById("group-crumb").textContent = group.title;
    document.getElementById("group-title").textContent = group.title;
    document.getElementById("group-desc").textContent = group.desc || "";
    const list = document.getElementById("group-list");

    if (Array.isArray(group.groups)) {
      const total = group.groups.reduce((sum, category) => sum + (category.items?.length || 0), 0);
      document.getElementById("group-count").textContent =
        `${group.groups.length} 個分類 · ${total} 個外部工具`;

      group.groups.forEach((category) => {
        const section = document.createElement("section");
        section.className = "subsection";
        section.dataset.category = category.id;

        const title = document.createElement("h2");
        title.className = "subsection-title";
        title.textContent = category.title;

        section.appendChild(title);

        if (category.desc) {
          const desc = document.createElement("p");
          desc.className = "intro";
          desc.textContent = category.desc;
          section.appendChild(desc);
        }

        const categoryList = document.createElement("div");
        categoryList.className = "list";

        (category.items || []).forEach((item, index) => {
          categoryList.appendChild(createItem(item, index));
        });

        if (!(category.items || []).length) {
          const empty = document.createElement("p");
          empty.className = "subsection-empty";
          empty.textContent = "尚未收錄外部工具。";
          categoryList.appendChild(empty);
        }

        section.appendChild(categoryList);
        list.appendChild(section);
      });

      if (targetCategory) {
        const section = list.querySelector(
          `[data-category="${CSS.escape(targetCategory)}"]`
        );
        const card = section?.querySelector(
          `[data-item-index="${CSS.escape(targetItem || "")}"]`
        );

        requestAnimationFrame(() => {
          (card || section)?.scrollIntoView({ behavior: "smooth", block: "center" });
          if (card) {
            card.classList.add("search-target");
            window.setTimeout(() => card.classList.remove("search-target"), 1800);
          }
        });
      }
    } else {
      document.getElementById("group-count").textContent = `${group.items?.length || 0} 個積木`;
      (group.items || []).forEach((item, index) => list.appendChild(createItem(item, index)));

      if (targetItem !== null) {
        const card = list.querySelector(`[data-item-index="${CSS.escape(targetItem)}"]`);
        if (card) {
          requestAnimationFrame(() => {
            card.scrollIntoView({ behavior: "smooth", block: "center" });
            card.classList.add("search-target");
            window.setTimeout(() => card.classList.remove("search-target"), 1800);
          });
        }
      }
    }
  }
</script>
</body>
</html>
