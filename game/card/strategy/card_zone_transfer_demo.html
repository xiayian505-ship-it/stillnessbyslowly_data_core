<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>卡牌區域移轉｜Demo｜慢慢軍火庫</title>
  <style>
    :root { font-family: system-ui, sans-serif; color-scheme: light; }
    body { max-width: 980px; margin: 24px auto; padding: 0 18px 40px; line-height: 1.65; }
    h1 { line-height: 1.25; }
    nav a { margin-right: 18px; }
    section { margin: 30px 0; }
    code, pre { font-family: ui-monospace, Consolas, monospace; }
    pre { padding: 14px; border: 1px solid #d7d7d7; background: #f7f7f7; white-space: pre; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #c9c9c9; padding: 9px; text-align: left; vertical-align: top; }
    th { background: #f2f2f2; }
    .controls { display: flex; flex-wrap: wrap; gap: 10px; }
    button { padding: 8px 12px; cursor: pointer; }
    .note { border-left: 3px solid #777; padding-left: 14px; }
    .pass { color: #176739; }
    .fail { color: #a61b1b; }
  </style>
</head>
<body>
  <nav><a href="card_zone_transfer_usage.html">使用說明</a> <a href="card_zone_transfer_demo.html">Demo 展示</a> <a href="test_card_zone_transfer.html">功能測試</a></nav>
  <h1>卡牌區域移轉｜Demo</h1>
  <p>借用既有 Deck 的快照與還原介面，在牌庫／手牌／棄牌區之間移動或交換卡牌。</p>

  <section>
    <h2>可操作示範</h2>
    <p>以下資料與操作僅用於展示積木 API；不是《霧林之契》，也不是策略系卡牌完成品。</p>
    <div class="controls">
      <button type="button" data-action="move">移動一張卡</button>
      <button type="button" data-action="swap">交換兩張卡</button>
      <button type="button" data-action="reset">重設兩個牌庫</button>
    </div>
    <h3>目前結果</h3>
    <pre id="demoOutput" aria-live="polite"></pre>
  </section>
  <script src="../deck.js"></script>
  <script src="./card_zone_transfer.js"></script>
  <script>
    let firstDeck;
    let secondDeck;

    function resetDecks() {
      firstDeck = Deck.create({ items: [], shuffleOnReset: false });
      secondDeck = Deck.create({ items: [], shuffleOnReset: false });
      firstDeck.restore({ ...firstDeck.snapshot(), hand: ["A", "B"] });
      secondDeck.restore({ ...secondDeck.snapshot(), hand: ["C", "D"] });
    }

    function runDemo(actionName) {
      if (actionName === "reset") {
        resetDecks();
      }

      if (actionName === "move" && firstDeck.snapshot().hand.length > 0) {
        CardZoneTransfer.moveCard({
          sourceDeck: firstDeck,
          sourceZone: "hand",
          destinationDeck: secondDeck,
          destinationZone: "discardPile",
          cardSelection: 0
        });
      }

      if (actionName === "swap" && firstDeck.snapshot().hand.length > 0) {
        CardZoneTransfer.swapCards({
          firstDeck,
          secondDeck,
          firstSelection: 0,
          secondSelection: 0
        });
      }

      return {
        firstDeck: firstDeck.snapshot(),
        secondDeck: secondDeck.snapshot()
      };
    }

    resetDecks();

    const outputElement = document.getElementById("demoOutput");

    // Demo 的按鈕和狀態顯示都只屬於本頁，不包含在零件本身。
    function showDemoResult(actionName) {
      try {
        const demoResult = runDemo(actionName);
        outputElement.textContent = JSON.stringify(demoResult, null, 2);
      } catch (error) {
        outputElement.textContent = error.name + ": " + error.message;
      }
    }

    document.querySelectorAll("[data-action]").forEach(function (buttonElement) {
      buttonElement.addEventListener("click", function () {
        showDemoResult(buttonElement.dataset.action);
      });
    });

    showDemoResult("move");
  </script>
</body>
</html>
