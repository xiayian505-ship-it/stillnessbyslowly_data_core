  <h1>回合順序狀態｜功能測試</h1>
  <p>保存參與者順序、目前輪到誰、整輪計數和宿主自訂的階段標記。</p>

  <section>
    <h2>獨立測試結果</h2>
    <p>下列斷言使用目前頁面引入的實際零件執行，而不是預先寫好的 PASS 字樣。</p>
    <pre id="testResults" aria-live="polite"></pre>
  </section>
  
  <script src="./card_turn_order.js"></script>
  <script>
    const testLines = [];
    let failureCount = 0;

    function verify(description, condition) {
      const passed = Boolean(condition);
      if (!passed) {
        failureCount += 1;
      }
      testLines.push((passed ? "PASS  " : "FAIL  ") + description);
    }

    function throwsError(callback) {
      try {
        callback();
        return false;
      } catch (error) {
        return true;
      }
    }

    try {
      const turnOrder = CardTurnOrder.createTurnOrder(["A", "B", "C"], { startRound: 2 });
      verify("開始由第一位行動", turnOrder.getCurrentParticipant() === "A");
      verify("能取得下一位", turnOrder.getNextParticipant() === "B");
      turnOrder.advanceTurn();
      verify("推進回合後換人", turnOrder.getCurrentParticipant() === "B");
      turnOrder.advanceTurn();
      turnOrder.advanceTurn();
      verify("完成一輪才加輪數", turnOrder.getSnapshot().currentRound === 3);
      const savedSnapshot = turnOrder.getSnapshot();
      turnOrder.advanceTurn();
      turnOrder.restoreSnapshot(savedSnapshot);
      verify("快照可以還原", turnOrder.getCurrentParticipant() === "A");
    } catch (error) {
      failureCount += 1;
      testLines.push("FAIL  測試執行錯誤：" + error.message);
    }

    testLines.push("");
    testLines.push(failureCount === 0 ? "ALL PASS" : failureCount + " FAILED");
    const resultElement = document.getElementById("testResults");
    resultElement.textContent = testLines.join("\n");
    resultElement.className = failureCount === 0 ? "pass" : "fail";
  </script>
</body>
