<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Undo Snapshot Stack｜局面撤銷｜Demo</title>
<style>
  .grid { display: grid; grid-template-columns: repeat(var(--columns, 5), minmax(32px, 42px)); gap: 3px; margin: 12px 0; }
  .cell { min-height: 37px; touch-action: manipulation; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 10px 0; }
  canvas { border: 1px solid; max-width: 100%; }
  output, pre { display: block; white-space: pre-wrap; margin: 10px 0; }
  button { padding: 5px; }
</style>
</head>
<body>
<h1>Undo Snapshot Stack｜局面撤銷</h1>
<p>本頁直接呼叫軍火庫零件；只提供辨識與操作必要的尺寸／排列。</p>

<div class="row"><button id="add">保存後增加數值與 Set</button><button id="undo">Undo</button><button id="clear">清除歷史</button></div>
<p>Demo 以容量 3 測試淘汰；每次操作後會顯示數字、Set 和堆疊摘要。</p>

<output id="result" aria-live="polite"></output>
<script src="https://lib.stillnessbyslowly.com/state/undo_snapshot_stack.js"></script>
<script>
(function () {
  "use strict";
  const result_element = document.getElementById("result");
  function show(value) {
    result_element.textContent = typeof value === "string" ? value : JSON.stringify(value, null, 2);
  }
  function report_error(error) {
    show("操作失敗：" + error.message);
    console.error(error);
  }

  const history=SlowlyUndoSnapshotStack.create({capacity:3});
  let state={counter:0,flags:new Set()};
  function render(){show({counter:state.counter,flags:[...state.flags],history:history.snapshot()});}
  document.getElementById('add').addEventListener('click',()=>{
    history.push(state);
    state.counter++;
    state.flags.add('step_'+state.counter);
    render();
  });
  document.getElementById('undo').addEventListener('click',()=>{
    const restored=history.undo();
    if(restored!==null)state=restored;
    render();
  });
  document.getElementById('clear').addEventListener('click',()=>{history.clear();render();});
  render();

})();
</script>
</body>
</html>
