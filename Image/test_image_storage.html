<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Image Storage Test</title>
<link rel="stylesheet" href="https://lib.stillnessbyslowly.com/ui/custom_file.css"></head><body>
<h1>Image Storage Test</h1>
<div class="slowly-file" id="image_picker">
<input class="slowly-file-native" id="image_file" type="file" accept="image/*">
<button class="slowly-file-trigger" type="button">選擇圖片</button>
<span class="slowly-file-label" data-default-label="尚未選擇圖片">尚未選擇圖片</span>
</div>
<p><button id="save_image">縮圖並存入 IndexedDB</button> <button id="load_image">讀取</button> <button id="delete_image">刪除</button></p>
<p>imageId：<code id="image_id">-</code></p><p id="status">尚未操作。</p>
<img id="preview" alt="預覽" hidden style="max-width:600px;width:100%;height:auto">
<script src="https://lib.stillnessbyslowly.com/ui/custom_file.js"></script>
<script src="./image_resize.js"></script><script src="./image_storage.js"></script>
<script>
SlowlyCustomFile.init("#image_picker");
const storage=ImageStorage.create({dbName:"slowly_image_storage_test"});
const input=document.querySelector("#image_file"),idEl=document.querySelector("#image_id"),status=document.querySelector("#status"),preview=document.querySelector("#preview");
let id="",url="";
function show(blob){if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(blob);preview.src=url;preview.hidden=false;}
document.querySelector("#save_image").onclick=async()=>{const f=input.files?.[0];if(!f){status.textContent="請先選擇圖片。";return;}try{const r=await ImageResize.resize(f);id=await storage.save(r.blob,{width:r.width,height:r.height});idEl.textContent=id;show(r.blob);status.textContent="已存入 IndexedDB。";}catch(e){status.textContent=e.message||String(e);}};
document.querySelector("#load_image").onclick=async()=>{if(!id){status.textContent="目前沒有 imageId。";return;}const b=await storage.getBlob(id);if(b){show(b);status.textContent="已讀取。";}else status.textContent="找不到圖片。";};
document.querySelector("#delete_image").onclick=async()=>{if(!id)return;await storage.remove(id);id="";idEl.textContent="-";if(url)URL.revokeObjectURL(url);url="";preview.hidden=true;preview.removeAttribute("src");status.textContent="已刪除。";};
</script></body></html>
