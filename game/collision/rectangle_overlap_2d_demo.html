<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rectangle Overlap 2D｜矩形接觸｜Demo</title>
<style>
  .grid { display: grid; grid-template-columns: repeat(var(--columns, 5), minmax(32px, 42px)); gap: 3px; margin: 12px 0; }
  .cell { min-height: 37px; touch-action: manipulation; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 10px 0; }
  canvas { border: 1px solid; max-width: 100%; }
  output, pre { display: block; white-space: pre-wrap; margin: 10px 0; }
  button { padding: 5px; }
</style>
</head>
<body>
<h1>Rectangle Overlap 2D｜矩形接觸</h1>
<p>本頁直接呼叫軍火庫零件；只提供辨識與操作必要的尺寸／排列。</p>

<div class="row"><label>第二矩形 X <input id="second_x" type="range" min="0" max="140" value="64"></label><label>第二矩形 Y <input id="second_y" type="range" min="0" max="100" value="45"></label><label><input id="inclusive" type="checkbox">相切算碰撞</label></div>
<canvas id="canvas" width="230" height="155"></canvas>

<output id="result" aria-live="polite"></output>
<script src="https://lib.stillnessbyslowly.com/game/collision/rectangle_overlap_2d.js"></script>
<script>
(function () {
  "use strict";
  const result_element = document.getElementById("result");
  function show(value) {
    result_element.textContent = typeof value === "string" ? value : JSON.stringify(value, null, 2);
  }
  function report_error(error) {
    show("操作失敗：" + error.message);
    console.error(error);
  }

  const canvas=document.getElementById('canvas');const context=canvas.getContext('2d');
  function render(){
    const first={x:35,y:35,width:80,height:65};
    const second={x:Number(document.getElementById('second_x').value),y:Number(document.getElementById('second_y').value),width:65,height:50};
    const response=SlowlyRectangleOverlap2D.inspect(first,second,{inclusive:document.getElementById('inclusive').checked});
    context.clearRect(0,0,canvas.width,canvas.height);
    context.strokeRect(first.x,first.y,first.width,first.height);
    context.setLineDash([5,3]);context.strokeRect(second.x,second.y,second.width,second.height);context.setLineDash([]);
    show(response);
  }
  for(const id of ['second_x','second_y','inclusive'])document.getElementById(id).addEventListener('input',render);render();

})();
</script>
</body>
</html>
