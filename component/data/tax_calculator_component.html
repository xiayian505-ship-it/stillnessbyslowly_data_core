<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Slowly Tax Calculator</title>

  <link rel="stylesheet" href="https://lib.stillnessbyslowly.com/ui/responsive.css">
  <link rel="stylesheet" href="./tax_calculator_component.css">

  <style>
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Noto Sans TC", sans-serif;
      background: #f6f3ef;
      color: #2d2926;
    }

    main {
      width: min(100%, 420px);
      padding: 24px;
      border: 1px solid #dfd5ce;
      border-radius: 18px;
      background: #fffaf6;
      box-shadow: 0 12px 32px rgba(64, 45, 34, 0.08);
      container-type: inline-size;
    }

    #tax-calculator .slowly-tax-calculator {
      --stc-text: #3c302b;
      --stc-muted: #806f67;
      --stc-line: #e7d8d0;
      --stc-surface: #fffdfb;
    }

    .note {
      width: min(100%, 420px);
      margin: 12px auto 0;
      font-size: 0.8rem;
      color: #806f67;
    }
  </style>
</head>
<body>
  <div>
    <main>
      <div id="tax-calculator"></div>
    </main>

    <p class="note">
      計算模型：營業額＝含稅金額 ÷（1＋稅率），四捨五入；稅額＝含稅金額－營業額。
    </p>
  </div>

  <script src="../../data/Tax.js"></script>
  <script src="./tax_calculator_component.js"></script>
  <script>
    const calculator = SlowlyTaxCalculator.create({
      target: "#tax-calculator",
      title: "營業稅計算",
      defaultRate: 5
    });

    calculator.focus();
  </script>
</body>
</html>
