<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Damage Roll 功能測試</title>
</head>
<body>
  <h1>Damage Roll 功能測試</h1>
  <pre id="result"></pre>

  <script src="./damage_roll.js"></script>
  <script>
    const result = document.getElementById("result");
    let pass = 0;
    let fail = 0;

    function assert(name, condition, detail) {
      if (condition) {
        pass += 1;
        result.textContent += "PASS | " + name + "\n";
      } else {
        fail += 1;
        result.textContent += "FAIL | " + name;
        if (detail) result.textContent += " | " + detail;
        result.textContent += "\n";
      }
    }

    let roll = DamageRoll.roll(3, 6, { rng: () => 0 });
    assert("rng=0 取得下限", roll.base === 3, JSON.stringify(roll));
    assert("無 bonus 時 total 等於 base", roll.total === 3);

    roll = DamageRoll.roll(3, 6, { rng: () => 0.999999 });
    assert("接近 1 取得上限", roll.base === 6, JSON.stringify(roll));

    roll = DamageRoll.roll(3, 6, { rng: () => 0, bonus: 4 });
    assert("bonus 加入 total", roll.total === 7, JSON.stringify(roll));
    assert("保留 base", roll.base === 3);
    assert("保留 bonus", roll.bonus === 4);

    assert(
      "value() 只回傳 total",
      DamageRoll.value(5, 5, { bonus: 2 }) === 7
    );

    const swapped = DamageRoll.normalizeRange(8, 2);
    assert(
      "min > max 自動交換",
      swapped.min === 2 && swapped.max === 8,
      JSON.stringify(swapped)
    );

    const decimal = DamageRoll.normalizeRange(2.9, 5.8);
    assert(
      "範圍轉為整數",
      decimal.min === 2 && decimal.max === 5,
      JSON.stringify(decimal)
    );

    roll = DamageRoll.roll(4, 4, { rng: () => 0.5, bonus: -1 });
    assert("固定範圍可使用", roll.base === 4);
    assert("bonus 可為負值", roll.total === 3);

    roll = DamageRoll.roll(1, 3, { rng: () => 1 });
    assert("rng=1 不超過上限", roll.base === 3, JSON.stringify(roll));

    result.textContent += "\n";
    result.textContent += "TOTAL PASS: " + pass + "\n";
    result.textContent += "TOTAL FAIL: " + fail + "\n";
  </script>
</body>
</html>
