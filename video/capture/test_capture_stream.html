<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Capture Stream Test</title></head>
<body>
<h1>Capture Stream — 功能測試</h1>
<p>純測試頁，沒有自訂 CSS。單獨載入本零件；測試用的 DOM 操作不是積木的一部分。</p>
<label>選擇本機影片（不會上傳）：<input id="file" type="file" accept="video/*"></label>
<p><video id="video" controls playsinline width="360"></video></p><p><button id="capture">取得影片串流</button> <button id="stop">停止本次串流 Tracks</button></p>
<pre id="out" aria-live="polite"></pre>
<script src="./capture_stream.js"></script>
<script>
"use strict";
const out = document.getElementById("out");
const video=document.querySelector("#video");let source="";
document.querySelector("#file").onchange = e => { if(source) URL.revokeObjectURL(source); const f=e.target.files[0]; if(!f)return; source=URL.createObjectURL(f);video.src=source;video.load();out.textContent="已載入："+f.name; };
window.addEventListener("pagehide",()=>{if(source) URL.revokeObjectURL(source);});let stream=null;
out.textContent="此媒體元素支援 captureStream："+SlowlyVideoCaptureStream.isSupported(video);
document.getElementById("capture").onclick=()=>{try{stream=SlowlyVideoCaptureStream.capture(video);out.textContent="擷取成功，tracks="+stream.getTracks().length+"；請播放影片以取得影格。";}catch(e){out.textContent=e.message;}};
document.getElementById("stop").onclick=()=>{if(stream)stream.getTracks().forEach(t=>t.stop());out.textContent="已停止 Tracks";};
</script>
</body></html>
