<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>Clipboard Cut Test</title><body><textarea id="text">請剪下這段文字</textarea><button id="select">先全選</button><button id="run">剪下</button><pre id="out"></pre><script src="./clipboard_copy.js"></script><script src="./clipboard_cut.js"></script><script>select.onclick=()=>text.select();run.onclick=async()=>{try{const v=await SlowlyClipboardCut.cut(text);out.textContent="PASS：剪下「"+v+"」"}catch(e){out.textContent="FAIL："+e.message}}</script></body></html>
