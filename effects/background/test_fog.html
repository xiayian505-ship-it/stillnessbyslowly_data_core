<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Canvas Fog（流動霧氣）｜功能測試</title>
  <style>
    /* 僅供此測試頁展示尺寸與底色，軍火庫 JS 不提供、不要求 CSS。 */
    body {
      margin: 24px;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      line-height: 1.65;
    }

    .test-stage {
      width: min(100%, 720px);
      height: 290px;
      background: #102627;
      border: 1px solid #778e89;
    }

    .test-stage canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 16px 0;
    }

    .controls button {
      padding: 8px 12px;
    }

    output {
      display: block;
      margin-top: 12px;
    }
  </style>
  <script src="./fog.js" defer></script>
</head>
<body>
  <h1>Canvas Fog（流動霧氣）｜功能測試</h1>
  <p>測試霧氣漂移、停止、手動推進與銷毀；不含森林和雨。</p>
  <p>以下只測試零件功能，舞台大小、背景色、Canvas 外觀皆由測試頁（宿主）設定。</p>

  <div class="test-stage">
    <canvas id="sample" aria-label="Canvas Fog（流動霧氣） 測試畫布"></canvas>
  </div>

  <div class="controls">
        <button type="button" id="start">開始</button>
        <button type="button" id="stop">停止</button>
        <button type="button" id="step">單步推進</button>
        <button type="button" id="resize">手動 resize</button>
        <button type="button" id="recreate">重新建立</button>
        <button type="button" id="destroy">銷毀</button>
  </div>
  <output id="status" role="status" aria-live="polite">尚未初始化</output>
  <p>改變瀏覽器寬度可測試 Canvas 自動調整尺寸。當系統設定「減少動態效果」時，零件將停留在靜態畫面。</p>

  <script>
  document.addEventListener('DOMContentLoaded', () => {
    'use strict';

    const canvas = document.getElementById('sample');
    const status = document.getElementById('status');
    const report = (message) => { status.textContent = message; };
    let effect = null;

    function createEffect() {
      effect?.destroy();
      effect = SlowlyCanvasFog.create({ canvas, count: 24, color: '#c0e5d9', opacity: 0.8 });
      effect.start();
      report('已建立；畫布 ' + canvas.width + ' × ' + canvas.height + ' px');
    }

    document.getElementById('start').addEventListener('click', () => {
      if (!effect) return report('已銷毀，請重新建立');
      effect.start();
      report('開始動畫');
    });
    document.getElementById('stop').addEventListener('click', () => {
      if (!effect) return report('已銷毀，請重新建立');
      effect.stop();
      report('動畫已停止');
    });
    document.getElementById('step').addEventListener('click', () => {
      if (!effect) return report('已銷毀，請重新建立');
      effect.stop();
      effect.advance(0.04);
      effect.draw();
      report('已手動推進 0.04 秒，不會自動重新啟動');
    });
    document.getElementById('resize').addEventListener('click', () => {
      if (!effect) return report('已銷毀，請重新建立');
      effect.resize();
      report('resize() 完成');
    });
    document.getElementById('recreate').addEventListener('click', createEffect);
    document.getElementById('destroy').addEventListener('click', () => {
      effect?.destroy();
      effect = null;
      report('已銷毀；停止動畫並解除尺寸及可見狀態監聽');
    });

    createEffect();
    window.addEventListener('pagehide', () => effect?.destroy(), { once: true });
  });
  </script>
</body>
</html>
