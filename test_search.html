<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fiction Search 功能測試</title>
  <style>
    :root {
      --bg: #f4f5f5;
      --surface: #ffffff;
      --text: #202426;
      --muted: #687176;
      --line: #d9dddf;
      --accent: #536d78;
      --content: 860px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, "Microsoft JhengHei", sans-serif;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    main {
      width: min(calc(100% - 32px), var(--content));
      margin: 0 auto;
      padding: 64px 0;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 2rem;
    }

    .intro {
      margin: 0 0 32px;
      color: var(--muted);
      line-height: 1.8;
    }

    .status {
      margin-bottom: 20px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      background: var(--surface);
      line-height: 1.7;
    }

    .grid {
      display: grid;
      gap: 14px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .card {
      padding: 18px;
      border: 1px solid var(--line);
      background: var(--surface);
    }

    .card h2 {
      margin: 0 0 12px;
      font-size: 1.05rem;
    }

    .desc {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.6;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button {
      padding: 8px 12px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
    }

    button:hover { border-color: var(--accent); }

    pre {
      margin: 20px 0 0;
      padding: 18px;
      min-height: 220px;
      overflow: auto;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .back {
      display: inline-block;
      margin-top: 18px;
      color: var(--accent);
      text-decoration: none;
    }

    .back:hover { text-decoration: underline; }

    @media (max-width: 680px) {
      main {
        width: min(calc(100% - 24px), var(--content));
        padding: 40px 0;
      }

      h1 { font-size: 1.7rem; }

      .grid { grid-template-columns: 1fr; }

      .card { padding: 16px; }

      pre {
        min-height: 180px;
        padding: 14px;
      }
    }
</style>
</head>
<body>
  <main>
    <h1>Fiction Search 功能測試</h1>
    <p class="intro">測試 Fiction_search.js 的關鍵字搜尋、指定欄位與巢狀欄位。</p>
    <div class="status" id="status">模組檢查中...</div>
    <div class="grid">
      <section class="card">
        <h2>Search</h2>
        <p class="desc">使用固定測試資料執行不同搜尋條件。</p>
        <div class="actions">
          <button id="title">搜尋「月」</button>
          <button id="author">搜尋作者「乙」</button>
          <button id="nested">搜尋 meta.note「夜」</button>
          <button id="empty">空白搜尋</button>
        </div>
      </section>
    </div>
    <pre id="output">等待操作...</pre>
    <a class="back" href="../">返回慢慢的倉庫</a>
  </main>
  <script src="./Fiction_search.js"></script>
  <script>
    const statusEl = document.getElementById("status");
    const output = document.getElementById("output");
    const items = [
      { title: "月下旅人", author: "甲", meta: { note: "夜行" } },
      { title: "白塔", author: "乙", meta: { note: "晨霧" } },
      { title: "月光森林", author: "丙", meta: { note: "森林" } }
    ];

    function show(title, data) {
      output.textContent = title + "\n\n" + JSON.stringify(data, null, 2);
    }

    if (typeof FictionSearch === "undefined") {
      statusEl.textContent = "載入失敗：找不到 FictionSearch";
      throw new Error("FictionSearch 未載入");
    }

    statusEl.textContent = "載入成功：FictionSearch v" + FictionSearch.version;

    document.getElementById("title").onclick = () =>
      show("搜尋「月」", FictionSearch.search(items, "月", ["title"]));

    document.getElementById("author").onclick = () =>
      show("搜尋作者「乙」", FictionSearch.search(items, "乙", ["author"]));

    document.getElementById("nested").onclick = () =>
      show("搜尋 meta.note「夜」", FictionSearch.search(items, "夜", ["meta.note"]));

    document.getElementById("empty").onclick = () =>
      show("空白搜尋", FictionSearch.search(items, "", ["title"]));
  </script>
</body>
</html>
