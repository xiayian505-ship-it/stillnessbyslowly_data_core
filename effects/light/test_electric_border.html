<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test Electric Border</title>
  <link rel="stylesheet" href="./electric_border.css">
  <style>
    body { font-family: sans-serif; padding: 24px; }
    .row { display: flex; flex-wrap: wrap; gap: 42px; margin: 28px 0 48px; }
    .box { width: 180px; min-height: 90px; padding: 16px; border-radius: 16px; border: 1px solid #bbb; background: white; }
    .fast { --slowly-electric-speed: .8s; }
    .thick { --slowly-electric-width: 5px; }
    .big-glow { --slowly-electric-glow-blur: 20px; --slowly-electric-glow-opacity: .9; }
    .custom {
      --slowly-electric-color-1: rgb(255, 30, 30);
      --slowly-electric-color-2: rgb(255, 220, 0);
      --slowly-electric-color-3: rgb(0, 210, 255);
      --slowly-electric-color-4: rgb(120, 50, 255);
    }
  </style>
</head>
<body>
  <h1>Electric Border 功能測試</h1>
  <p>此頁只做功能驗證，不代表宿主視覺。</p>

  <h2>1. inactive</h2>
  <div class="row"><div class="box slowly-electric-border">inactive</div></div>

  <h2>2. line only</h2>
  <div class="row"><div class="box slowly-electric-border is-active">line only</div></div>

  <h2>3. line + glow</h2>
  <div class="row"><div class="box slowly-electric-border with-glow is-active">with glow</div></div>

  <h2>4. 同頁混用</h2>
  <div class="row">
    <div class="box slowly-electric-border is-active">line only</div>
    <div class="box slowly-electric-border with-glow is-active">line + glow</div>
  </div>

  <h2>5. 速度 / 線寬</h2>
  <div class="row">
    <div class="box slowly-electric-border is-active fast">fast</div>
    <div class="box slowly-electric-border is-active thick">thick</div>
  </div>

  <h2>6. 光暈強度</h2>
  <div class="row">
    <div class="box slowly-electric-border with-glow is-active">default glow</div>
    <div class="box slowly-electric-border with-glow is-active big-glow">big glow</div>
  </div>

  <h2>7. 自訂 RGB</h2>
  <div class="row">
    <div class="box slowly-electric-border is-active custom">custom line</div>
    <div class="box slowly-electric-border with-glow is-active custom">custom glow</div>
  </div>

  <h2>8. 動態切換 glow</h2>
  <button id="activeBtn" type="button">切換 active</button>
  <button id="glowBtn" type="button">切換 glow</button>
  <div class="row">
    <div id="target" class="box slowly-electric-border is-active">target</div>
  </div>

  <script>
    const target = document.getElementById("target");

    document.getElementById("activeBtn").addEventListener("click", () => {
      target.classList.toggle("is-active");
    });

    document.getElementById("glowBtn").addEventListener("click", () => {
      target.classList.toggle("with-glow");
    });
  </script>
</body>
</html>
