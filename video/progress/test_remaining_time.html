<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Remaining Time Test</title></head>
<body>
<h1>Remaining Time — 功能測試</h1>
<p>純測試頁，沒有自訂 CSS。單獨載入本零件；測試用的 DOM 操作不是積木的一部分。</p>
<p><button id="check">計算剩餘秒數</button></p>
<pre id="out" aria-live="polite"></pre>
<script src="./remaining_time.js"></script>
<script>
"use strict";
const out = document.getElementById("out");
document.getElementById("check").onclick=()=>out.textContent=`影片 120 秒，在第 30 秒、2 倍速剩餘：${SlowlyVideoRemainingTime.seconds(30,120,2)} 秒\n5 倍速剩餘：${SlowlyVideoRemainingTime.seconds(30,120,5)} 秒\n未知總長度：${SlowlyVideoRemainingTime.seconds(30,Infinity,2)}`;document.getElementById("check").click();
</script>
</body></html>
