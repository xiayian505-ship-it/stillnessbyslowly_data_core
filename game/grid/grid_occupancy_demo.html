<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grid Occupancy｜格子佔位｜Demo</title>
<style>
  .grid { display: grid; grid-template-columns: repeat(var(--columns, 5), minmax(32px, 42px)); gap: 3px; margin: 12px 0; }
  .cell { min-height: 37px; touch-action: manipulation; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 10px 0; }
  canvas { border: 1px solid; max-width: 100%; }
  output, pre { display: block; white-space: pre-wrap; margin: 10px 0; }
  button { padding: 5px; }
</style>
</head>
<body>
<h1>Grid Occupancy｜格子佔位</h1>
<p>本頁直接呼叫軍火庫零件；只提供辨識與操作必要的尺寸／排列。</p>

<div class="row"><label>編輯模式 <select id="mode"><option value="blocked">牆</option><option value="occupied">佔用</option><option value="clear">清空</option></select></label><button id="reset">重設</button></div>
<div id="board" class="grid" style="--columns:5"></div>
<p>按格子可切換牆／佔用／空格，同時檢查可否進入。</p>

<output id="result" aria-live="polite"></output>
<script src="https://lib.stillnessbyslowly.com/game/grid/grid_occupancy.js"></script>
<script>
(function () {
  "use strict";
  const result_element = document.getElementById("result");
  function show(value) {
    result_element.textContent = typeof value === "string" ? value : JSON.stringify(value, null, 2);
  }
  function report_error(error) {
    show("操作失敗：" + error.message);
    console.error(error);
  }

  const rows=4;
  const columns=5;
  const walls=new Set(["1:2"]);
  const objects=new Set(["2:3"]);
  const board=document.getElementById("board");
  function key(position){return `${position.r}:${position.c}`;}
  const options={rows,columns,is_blocked:position=>walls.has(key(position)),is_occupied:position=>objects.has(key(position))};
  function render(position={r:0,c:0}){
    board.replaceChildren();
    for(let row=0;row<rows;row++)for(let column=0;column<columns;column++){
      const cell={r:row,c:column};
      const state=SlowlyGridOccupancy.inspect(cell,options);
      const button=document.createElement('button');
      button.className='cell';
      button.textContent=state.blocked?'牆':state.occupied?'物':'·';
      button.title=`第 ${row+1} 列、第 ${column+1} 欄`;
      button.addEventListener('click',()=>{
        const value=document.getElementById('mode').value;
        walls.delete(key(cell));objects.delete(key(cell));
        if(value==='blocked')walls.add(key(cell));
        if(value==='occupied')objects.add(key(cell));
        render(cell);
      });
      board.appendChild(button);
    }
    show({position, ...SlowlyGridOccupancy.inspect(position,options)});
  }
  document.getElementById('reset').addEventListener('click',()=>{walls.clear();objects.clear();render();});
  render();

})();
</script>
</body>
</html>
