<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Formation Movement 2D｜實際操作 Demo</title>
<style>
body { margin: 1rem auto; padding: 0 1rem 3rem; max-width: 920px; font: 16px/1.6 system-ui, sans-serif; }
button, input, select, textarea { font: inherit; }
button, input, select { min-height: 40px; }
button { cursor: pointer; margin: .2rem; }
fieldset { margin: 1rem 0; border: 1px solid #aaa; }
label { display: inline-flex; flex-direction: column; margin: .25rem .65rem .25rem 0; }
pre, output { white-space: pre-wrap; overflow-wrap: anywhere; }
pre { border: 1px solid #bbb; padding: .6rem; }
table { border-collapse: collapse; width: 100%; }
th, td { border: 1px solid #aaa; padding: .3rem .5rem; text-align: left; vertical-align: top; }
.pass { color: #14622c; } .fail { color: #a22222; }
#results > li { margin-bottom: .25rem; }


#stage { position: relative; width: 300px; height: 240px; max-width: 100%; border: 1px solid; overflow: hidden; }
.rectangle { position: absolute; box-sizing: border-box; border: 1px solid; background: #ddd; display: grid; place-items: center; }
</style>
</head>
<body>
<main>
<h1>Formation Movement 2D｜實際操作 Demo</h1>
<p>六個成員同步水平移動；碰到邊界時整隊向下移動、反向，不包含碰撞、敵人 AI 或分數。</p>

<fieldset><legend>整隊參數</legend>
<label>速度（單位／秒）<input id="speed" type="number" min="0" value="90"></label>
<label>下一幀秒數<input id="delta_seconds" type="number" min="0" step="0.1" value="0.2"></label>
<label>右界線<input id="right_bound" type="number" min="170" max="330" value="300"></label>
<label>每次下移距離<input id="drop_distance" type="number" min="0" value="15"></label>
<p><button id="step">下一幀</button><button id="reset">重設</button></p></fieldset>
<div id="stage" aria-label="隊形展示場地"></div>
<pre id="report" aria-live="polite"></pre>

</main>
<script src="https://lib.stillnessbyslowly.com/game/movement/formation_movement_2d.js"></script>
<script>

const api = window.SlowlyFormationMovement2D;
const stage = document.querySelector("#stage");
const report = document.querySelector("#report");
let entities = [
  { id: 1, x: 30, y: 20, width: 30, height: 24, active: true },
  { id: 2, x: 80, y: 20, width: 30, height: 24, active: true },
  { id: 3, x: 130, y: 20, width: 30, height: 24, active: true },
  { id: 4, x: 30, y: 70, width: 30, height: 24, active: true },
  { id: 5, x: 80, y: 70, width: 30, height: 24, active: true },
  { id: 6, x: 130, y: 70, width: 30, height: 24, active: true }
];
let direction = 1;
function render(message) {
  stage.replaceChildren();
  entities.forEach(function (entity) {
    const rectangle = document.createElement("div");
    rectangle.className = "rectangle";
    rectangle.style.left = entity.x + "px";
    rectangle.style.top = entity.y + "px";
    rectangle.style.width = entity.width + "px";
    rectangle.style.height = entity.height + "px";
    rectangle.textContent = String(entity.id);
    rectangle.setAttribute("aria-label", "成員 " + entity.id);
    stage.appendChild(rectangle);
  });
  report.textContent = message + "\n目前方向：" + (direction > 0 ? "右" : "左") +
    "\n隊形：" + JSON.stringify(entities, null, 2);
}
document.querySelector("#step").addEventListener("click", function () {
  try {
    const result = api.plan_step({
      entities,
      direction,
      speed: Number(document.querySelector("#speed").value),
      delta_seconds: Number(document.querySelector("#delta_seconds").value),
      left_bound: 0,
      right_bound: Number(document.querySelector("#right_bound").value),
      margin: 6,
      drop_distance: Number(document.querySelector("#drop_distance").value)
    });
    entities = result.entities;
    direction = result.direction;
    render("本幀：" + (result.bounced ? "碰邊→整隊折返下移" : "水平前進") +
      "；位移=" + JSON.stringify(result.displacement));
  } catch (error) {
    report.textContent = "錯誤：" + error.message;
  }
});
document.querySelector("#reset").addEventListener("click", function () {
  location.reload();
});
render("等待下一幀");

</script>
</body>
</html>
