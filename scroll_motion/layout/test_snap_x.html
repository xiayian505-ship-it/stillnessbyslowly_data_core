<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Layout snap_x | 慢慢軍火庫測試</title><style>body{margin:0;color:#243047;font-family:system-ui,"Microsoft JhengHei",sans-serif;line-height:1.7;background:#f0f4f9;} main{max-width:960px;margin:auto;padding:32px 20px;}h1{font-size:clamp(1.5rem,4vw,2.25rem);line-height:1.2}code{font-size:.9em} .intro{min-height:82vh;padding:30px;box-sizing:border-box;background:linear-gradient(150deg,#fff,#dceafe)}.card{width:min(360px,82vw);box-sizing:border-box;padding:24px;border-radius:18px;background:#fff;box-shadow:0 10px 26px #0c345226;font-weight:700;font-size:1.4rem;text-align:center}.spacer{height:95vh}.end{min-height:70vh;background:#dceafe;padding:40px 24px}.tag{background:#e8efff;padding:3px 7px;border-radius:5px}
</style><link rel="stylesheet" href="./snap_x.css"></head><body><main><h1>Layout / Snap X</h1><p>在下方容器內捲動或滑動，每一格會吸附到固定位置。</p><div class="slowly-snap-x" style="display:flex;height:62vh;border:2px solid #90b4e9;border-radius:16px"><section class="slowly-snap-child" style="flex:0 0 100%;height:100%;display:grid;place-items:center;background:hsl(230 78% 88%);font-size:3rem">1</section><section class="slowly-snap-child" style="flex:0 0 100%;height:100%;display:grid;place-items:center;background:hsl(260 78% 88%);font-size:3rem">2</section><section class="slowly-snap-child" style="flex:0 0 100%;height:100%;display:grid;place-items:center;background:hsl(290 78% 88%);font-size:3rem">3</section><section class="slowly-snap-child" style="flex:0 0 100%;height:100%;display:grid;place-items:center;background:hsl(320 78% 88%);font-size:3rem">4</section></div></main></body></html>
